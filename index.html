10px;margin-bottom:7px}.sectionrow,.buttonrow,.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sectionrow{justify-content:space-between;margin-bottom:7px}.sectionrow strong{font-size:14px}.compact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.workspace{position:relative;border-radius:10px;overflow:hidden;background:#ebe7e1;border:1px solid #dbd4cc;min-height:200px;display:flex;align-items:center;justify-content:center;isolation:isolate}.workspace svg{display:block;width:100%;height:auto;max-height:min(65dvh,650px);touch-action:none;user-select:none;-webkit-user-select:none}.workspace.photo{background:#464849}.workspace.photo svg{max-height:68dvh;max-width:100%;width:auto}.toolstrip{display:flex;gap:5px;align-items:center;margin:6px 0;overflow-x:auto;scrollbar-width:none}.toolstrip button{padding:7px 9px;font-size:12px;min-height:33px}.toolstrip .spacer{flex:1}.hint{font-size:11.5px;color:#645b52;background:#ebe6df;padding:6px 8px;border-radius:7px;margin-top:6px;line-height:1.35}.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{min-height:30px;font-size:11.5px;padding:5px 8px}.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.voicebar{background:white;border:1px solid #dfd8cf;border-radius:10px;padding:7px;margin-top:7px}.voicebar .row{justify-content:space-between}.voicebar .voice-actions{display:flex;gap:5px}.voicebar button{font-size:12px;padding:7px 8px}.voicebar .speak{background:#766e64;border-color:#766e64;color:white}.voicebar .voice-state{font-size:11px;color:var(--mute)}.voicebar .live{color:#b65316;font-weight:700}.voicebar .vtarget{font-weight:700;color:#b95111}.voicebar .heard{font-size:11px;color:#776f65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:4px}.voicebar .vmanual{display:flex;gap:4px;margin-top:5px}.voicebar .vmanual input{flex:1;min-height:31px;padding:6px}.voicebar .vmanual button{min-height:31px}.voicebar .vchecks{display:flex;gap:12px;margin-top:5px;flex-wrap:wrap;font-size:11px}.voicebar .vchecks input{width:14px;height:14px}.dimlist{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:7px}.dimlist button{font-size:11px;min-height:29px;padding:5px 8px}.dimlist .ready{color:var(--green)}.titleline{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:6px}.titleline h2{font-size:15px;margin:0}.wallgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:5px;margin:6px 0}.wallcard{font-size:12px;text-align:left;white-space:normal}.wallcard b{display:block}.wallcard small{font-size:10px;color:var(--mute)}.bottomsheet{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:env(safe-area-inset-bottom,0px);width:min(calc(100% - 12px),520px);background:white;border:1px solid #d1c8be;box-shadow:0 -6px 28px #0003;border-radius:15px 15px 7px 7px;padding:11px;max-height:65dvh;overflow:auto}.sheettitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheettitle strong{font-size:14px}.sheettitle button{min-height:29px;padding:4px 8px}.sheetcontent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.sheetcontent .wide{grid-column:1/-1}.sheetactions{display:flex;gap:5px;margin-top:10px;justify-content:flex-end}.overlay{position:fixed;inset:0;background:#0002;z-index:29}.subnav{display:flex;gap:5px}.subnav button{flex:1}.helpgrid{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.helpgrid span{font-size:10px;padding:3px 6px;border-radius:5px;background:#eee8e0}.notice{border-left:3px solid var(--orange);background:#fff6e9;font-size:11px;padding:7px 9px;margin:6px 0;border-radius:3px}.exportrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.exportrow button{flex:1}.muted{color:var(--mute)}.filebtn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border:1px solid #d5cec6;border-radius:8px;background:white;min-height:34px;padding:7px 9px;font-weight:650;font-size:12px;cursor:pointer}.filebtn input{display:none}.layerrow{display:flex;gap:4px;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0ece7;font-size:12px}.layerrow button{min-height:26px;padding:4px 8px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.summary>div{background:#eeeae4;border-radius:8px;padding:8px}.summary b{display:block}.printonly{display:none}.measureflag{color:#b04421}
@media(max-width:390px){.app{padding:5px}.nav button{font-size:11px;padding:6px 3px}.toolstrip button{font-size:11px;padding:6px}.topright{gap:2px}.status{max-width:78px}.workspace svg{max-height:60dvh}.compact{gap:5px}}

/* Revisão de campo: controls mais compactos, mantendo alvos de toque */
@media(max-width:700px){.panel{padding:7px;margin-bottom:5px}.sectionrow{margin-bottom:4px}.toolstrip{gap:3px;margin:4px 0}.toolstrip button,.filebtn{font-size:11px;padding:5px 7px;min-height:32px}.voicebar{padding:5px}.hint{font-size:10.5px;padding:4px 6px}.workspace svg{max-height:72dvh}}
.wizard{display:flex;gap:3px;margin:5px 0;overflow-x:auto;scrollbar-width:none}.wizard button{font-size:11px;padding:5px 8px;min-height:32px}.wizard button.current{background:#fff0e2;border-color:#ef9048;color:#a55011}.wizard button.done{color:#397257}.room-meta-summary{font-size:12px;color:#71695f;margin:4px 0}.softrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
</style></head><body>
<main class="app">
<div class="topbar"><div class="logo"><b>◈</b> CotaLab <span class="tiny">· Levantamento</span></div><div class="topright"><span class="status" id="save-status">Local</span><button class="iconbtn" id="helpbtn" title="Como usar">?</button></div></div>
<nav class="nav" id="nav"><button data-page="inicio" class="active">Ambiente</button><button data-page="paredes">Paredes</button><button data-page="bancadas">Bancadas</button><button data-page="exportar">Exportar</button></nav>
<div id="page"></div>
<section class="voicebar" id="voicebar"><div class="row"><div><span class="vtarget" id="vtarget">Cotas pendentes</span> <span class="voice-state" id="vstatus">Pronto</span></div><div class="voice-actions"><button id="voice-go" class="speak">🎙 Iniciar</button><button id="voice-confirm" disabled>✓</button><button id="voice-reject" disabled>↺</button></div></div><div class="heard" id="vheard">Selecione uma cota ou comece a sequência de medição.</div><div class="vmanual"><input id="voice-manual" placeholder="Medida ou comando (ex.: 850, sim)" inputmode="text"><button id="voice-send">Enviar</button></div><div class="vchecks"><label class="checkrow"><input type="checkbox" id="handsfree" checked> Mãos livres</label><label class="checkrow"><input type="checkbox" id="voice-sound" checked> Falar</label></div><div class="dimlist" id="dimlist"></div></section>
<div class="notice" id="notice">Desenhe o ambiente na planta. As medidas reais são registradas em milímetros.</div>
</main><div class="overlay hidden" id="overlay"></div><div class="bottomsheet hidden" id="sheet"></div><div class="printonly" id="printarea"></div>
<script>

'use strict';
const $=s=>document.querySelector(s), el=(tag,attrs={},text='')=>{let x=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));x.textContent=text;return x};
const uid=()=>Math.random().toString(36).slice(2,10), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>Number.isFinite(Number(x))?Number(x):0, mm=x=>Math.max(0,Math.round(n(x)*10)/10), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), num=x=>Number.isFinite(n(x))?n(x).toLocaleString('pt-BR',{maximumFractionDigits:1}):'—';
const defaultState=()=>({version:2,meta:{profissional:'',cliente:'',obra:'',ambiente:'Cozinha',pe:2700,paredeTipo:'Alvenaria',espessura:150},polygon:[],closed:false,walls:[],benches:[],dims:[],nextDim:1,savedRooms:[],currentRoomId:null});
let S;try{S=JSON.parse(localStorage.getItem('cotalab_project_v2'))||defaultState()}catch(_){S=defaultState()}if(!S?.meta||!Array.isArray(S.walls)||!Array.isArray(S.benches)||![2,3].includes(Number(S.version)))S=defaultState();else S.version=2;if(!Array.isArray(S.savedRooms))S.savedRooms=[];if(!S.currentRoomId)S.currentRoomId=uid();for(let b of S.benches||[]){if(!b.elements) b.elements=[];let redundant=b.elements.filter(o=>['ilharga','apoio'].includes(o.type));if(redundant.some(o=>o.type==='ilharga'))b.ilhargas=Math.min(2,Math.max(b.ilhargas||0,redundant.filter(o=>o.type==='ilharga').length));if(redundant.some(o=>o.type==='apoio'))b.apoio=true;let ids=new Set(redundant.map(o=>o.id));if(ids.size){b.elements=b.elements.filter(o=>!ids.has(o.id));S.dims=S.dims.filter(d=>!ids.has(d.owner))}}
let metaCollapsed=false,roomDiagonal=false,wallStage='parede',wallReview=false,voiceAwaitStart=false,photoRectifying=false;
let page='inicio',currentWall=null,currentBench=null,benchView='planta',tool='idle',gesture=null,activeDim=null,activeObject=null,wallLayer={pontos:true,aberturas:true,interferencias:true,manuais:true},history=[],toastTimer=null,pendingSheet=false;
let photoCache={};const DB_NAME='CotaLabFotos2';let database=null;
function openDB(){return new Promise(res=>{if(!indexedDB)return res(null);let r;try{r=indexedDB.open(DB_NAME,1)}catch(e){return res(null)}r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>{database=r.result;res(database)};r.onerror=()=>res(null)})}
async function dbGet(key){if(!database)return null;return new Promise(res=>{const q=database.transaction('fotos').objectStore('fotos').get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
function dbPut(key,val){if(!database)return;try{database.transaction('fotos','readwrite').objectStore('fotos').put(val,key)}catch(_){}}
const save=()=>{try{localStorage.setItem('cotalab_project_v2',JSON.stringify(S));$('#save-status').textContent='Salvo neste aparelho'}catch(e){$('#save-status').textContent='Armazenamento cheio';notify('Não foi possível salvar. Exporte o JSON para conservar as medidas.')}};
let saveTimer=null;function changed(){clearTimeout(saveTimer);saveTimer=setTimeout(save,130)}
function commit(){history.push(JSON.stringify(S));if(history.length>35)history.shift();changed()}
function undo(){if(!history.length){notify('Nada para desfazer.');return}S=JSON.parse(history.pop());currentWall=S.walls.some(w=>w.id===currentWall)?currentWall:S.walls[0]?.id;currentBench=S.benches.some(b=>b.id===currentBench)?currentBench:S.benches[0]?.id;changed();render()}
function notify(text){$('#notice').textContent=text}
const svgP=(a)=>a.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), mul=(a,k)=>({x:a.x*k,y:a.y*k}), dot=(a,b)=>a.x*b.x+a.y*b.y;
function nearestSegment(p,a,b){let v=sub(b,a),t=clamp(dot(sub(p,a),v)/(dot(v,v)||1),0,1);return {p:add(a,mul(v,t)),d:d2(p,add(a,mul(v,t))),t}}
const wallName=i=>String.fromCharCode(65+(i%26));
function roomSnapshot(){return {id:S.currentRoomId,ambiente:S.meta.ambiente,pe:S.meta.pe,paredeTipo:S.meta.paredeTipo,espessura:S.meta.espessura,polygon:structuredClone(S.polygon),closed:S.closed,walls:structuredClone(S.walls),benches:structuredClone(S.benches),dims:structuredClone(S.dims),nextDim:S.nextDim}}
function setRoomSnapshot(r){S.currentRoomId=r.id;S.meta.ambiente=r.ambiente;S.meta.pe=r.pe;S.meta.paredeTipo=r.paredeTipo;S.meta.espessura=r.espessura;S.polygon=structuredClone(r.polygon);S.closed=r.closed;S.walls=structuredClone(r.walls);S.benches=structuredClone(r.benches);S.dims=structuredClone(r.dims);S.nextDim=r.nextDim;currentWall=null;currentBench=null;tool='idle';voiceTarget=null;activeObject=null;activeDim=null;}
function newRoom(){if(!S.closed){notify('Conclua a planta atual antes de iniciar outro ambiente.');return}commit();S.savedRooms.push(roomSnapshot());let former=roomSnapshot();setRoomSnapshot({id:uid(),ambiente:'Outro',pe:former.pe,paredeTipo:former.paredeTipo,espessura:former.espessura,polygon:[],closed:false,walls:[],benches:[],dims:[],nextDim:1});metaCollapsed=true;pageTo('inicio');changed();notify('Novo ambiente da mesma obra. Cliente, profissional e obra preservados.');}
function switchRoom(id){if(id===S.currentRoomId)return;let i=S.savedRooms.findIndex(r=>r.id===id);if(i<0)return;commit();let wanted=S.savedRooms[i];S.savedRooms.splice(i,1);S.savedRooms.push(roomSnapshot());setRoomSnapshot(wanted);pageTo('inicio');changed();}

function planeWall(p){let found=null;S.walls.forEach(w=>{const a=S.polygon[w.i],b=S.polygon[(w.i+1)%S.polygon.length];if(!a||!b)return;const t=nearestSegment(p,a,b);if(!found||t.d<found.d)found={...t,wall:w}});return found}
function syncWalls(){if(!S.closed)return;S.walls=S.polygon.map((p,i)=>{let old=S.walls.find(w=>w.i===i);return old||{id:uid(),i,letra:wallName(i),comprimento:0,pe:null,tipo:null,espessura:null,quad:null,items:[],photo:false,photoH:650}})}
function addDim({scope,label,kind='auto',owner=null,metric=null,view=null,geom=null,layer='manuais',value=null,ref=null,orientation=null,section=null}){let d={id:S.nextDim++,scope,label,kind,owner,metric,view,geom,layer,value:mm(value)||null,labelSide:1,ref,orientation,section};S.dims.push(d);return d}
function dimVal(id){return S.dims.find(x=>x.id===id)?.value||null}
function dimByOwner(owner,metric){return S.dims.find(x=>x.owner===owner&&x.metric===metric)}
function dimScope(){return page==='paredes'?'photo:'+currentWall:page==='bancadas'?'bench:'+currentBench+':'+benchView:null}
function visibleDims(){let scope=dimScope();let ds=S.dims.filter(d=>d.scope===scope&&(page!=='paredes'||wallLayer[d.layer]!==false));if(page==='paredes'&&wallStage==='medir'){for(let d of ds){if(!d.section){let o=activeWall()?.items.find(o=>o.id===d.owner);d.section=o?.section||(o?.kind==='door'?'portas':o?.kind==='window'?'janelas':o?.kind==='air'?'ar':o?.kind==='interference'?'interferencias':o?.type==='point'?'pontos':'manuais')}}const rank={interferencias:0,ar:1,portas:2,janelas:3,pontos:4,manuais:5};ds.sort((a,b)=>(rank[a.section]??6)-(rank[b.section]??6)||a.id-b.id)}return ds}
function editDim(d,val){d.value=val?mm(val):null;changed();render();}
function loadUi(){const nav=$('#nav');nav.classList.toggle('hidden',page==='paredes');nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#voicebar').classList.toggle('hidden',page==='inicio'||page==='exportar'||(page==='paredes'&&wallStage!=='medir'&&wallStage!=='revisao'));}
function pageTo(p){page=p;tool='idle';activeDim=null;activeObject=null;closeSheet();if(p==='paredes'){wallStage='parede';wallReview=false;}if(page==='paredes'&&!currentWall)currentWall=S.walls[0]?.id||null;if(page==='bancadas'&&!currentBench)currentBench=S.benches[0]?.id||null;render()}
function setSheet(title,html,onBind=null){const sh=$('#sheet');$('#overlay').classList.remove('hidden');sh.classList.remove('hidden');sh.innerHTML=`<div class="sheettitle"><strong>${esc(title)}</strong><button data-close>✕</button></div>${html}`;if(onBind)onBind(sh)}
function closeSheet(){$('#sheet').classList.add('hidden');$('#overlay').classList.add('hidden')}
function envDefaults(amb){return /cozinha|banheiro|lavabo|gourmet|serviço|servico|varanda/i.test(amb)}
function render(){loadUi();const target=$('#page');if(page==='inicio')target.innerHTML=homeHTML();if(page==='paredes')target.innerHTML=wallsHTML();if(page==='bancadas')target.innerHTML=benchesHTML();if(page==='exportar')target.innerHTML=exportHTML();paintVoice()}
function homeHTML(){let m=S.meta;return `<section class="panel"><div class="sectionrow"><strong>Dados do levantamento</strong><button data-act="meta-toggle">${metaCollapsed?'Dados da obra ▾':'Recolher ▴'}</button></div>${metaCollapsed?`<div class="room-meta-summary">${esc(m.profissional||'Profissional')} · ${esc(m.cliente||'Cliente')} · ${esc(m.obra||'Obra')}</div>`:`<div class="compact"><label class="field"><span>Profissional</span><input data-meta="profissional" value="${esc(m.profissional)}"></label><label class="field"><span>Cliente</span><input data-meta="cliente" value="${esc(m.cliente)}"></label><label class="field wide"><span>Obra / apartamento</span><input data-meta="obra" value="${esc(m.obra)}"></label></div>`}<div class="compact" style="margin-top:6px"><label class="field"><span>Ambiente</span><select data-meta="ambiente">${['Cozinha','Banheiro','Lavabo','Área de serviço','Área gourmet','Varanda','Quarto','Sala','Escritório','Outro'].map(v=>`<option ${m.ambiente===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Estrutura padrão</span><select data-meta="paredeTipo">${['Alvenaria','Drywall','Outra'].map(v=>`<option ${m.paredeTipo===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Pé-direito (mm)</span><input type="number" data-meta="pe" value="${esc(m.pe)}" inputmode="decimal"></label><label class="field"><span>Espessura (mm)</span><input type="number" data-meta="espessura" value="${esc(m.espessura)}" inputmode="decimal"></label></div></section>
<section class="panel"><div class="sectionrow"><strong>Ambientes da obra</strong><button data-act="room-new" ${!S.closed?'disabled':''}>+ Novo ambiente</button></div><div class="chips">${S.savedRooms.map((r,i)=>`<button data-room-select="${r.id}">${esc(r.ambiente||'Ambiente '+(i+1))}</button>`).join('')}<button class="active">${esc(m.ambiente)} ✓</button></div></section>

function benchLinePoly(path,depth=32){
 if(path.length<2)return null;
 const ctr=centroid(S.polygon.length?S.polygon:path),segs=[];
 for(let i=0;i<path.length-1;i++){
   let a=path[i],b=path[i+1],v=sub(b,a),len=Math.hypot(v.x,v.y)||1;
   let normal={x:-v.y/len,y:v.x/len};

   segs.push({v,normal});
 }

 for(let i=0;i<path.length;i++){
   if(i===0){inside.push(add(path[i],mul(segs[0].normal,depth)));continue}

function benchSocoShape(b,t){

 if(back.length<2)return '';
 const commonDepth=S.dims.find(d=>d.owner===b.id&&d.metric==='depth0')?.value||600;
 const draftDepth=benchDepth(b,0);
 const recess=clamp(draftDepth*(b.socoRecuo||70)/commonDepth,2,draftDepth*.7);
 let inner=benchLinePoly(back,draftDepth-recess).slice(back.length).reverse().map(t);
 // O soco acompanha a frente da bancada. Apenas pontas livres recebem recuo lateral;
 // extremidades em parede ou protegidas por ilhargas mantêm o alinhamento.
 const path=b.path.map(t);
 let leftFree=!(b.links?.[0])&&b.ilhargas<1;

}

function strip(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9,.\s-]/g,' ').replace(/\s+/g,' ').trim()}
const small={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezassete:17,dezessete:17,dezoito:18,dezenove:19};
const tens={vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90};
const hundreds={cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,oitocentos:800,oitocentas:800,novecentos:900,novecentas:900};
function quantity(raw){
 let s=strip(raw).replace(/\b(de|da|do|a|ate|com|uns|aproximadamente)\b/g,' ').replace(/\s+/g,' ').trim();
 if(!s)return null;
 const spokenDecimal=s.match(/^(.+?)\s+virgula\s+(.+)$/);
 if(spokenDecimal){let int=quantity(spokenDecimal[1]),fraction=quantity(spokenDecimal[2]);
   if(int!=null&&fraction!=null){let words=spokenDecimal[2].split(/\s+/),leadZero=words[0]==='zero'?1:0;
    let digits=String(Math.floor(fraction)).length+leadZero;return int+fraction/Math.pow(10,Math.max(1,digits));}}
 if(/^\d+(?:[,.]\d+)?$/.test(s))return Number(s.replace(',','.'));
 if(/^([\w ]+) e mei[oa]$/.test(s)){let b=quantity(s.replace(/ e mei[oa]$/,''));return b==null?null:b+.5;}
 let tokens=s.split(/\s+/),val=0,group=0,found=false;
 for(let t of tokens){if(t==='e')continue;
  if(t==='mil'){group=(group||1)*1000;val+=group;group=0;found=true;continue}
  let n=small[t]??tens[t]??hundreds[t];if(n===undefined)return null;
  group+=n;found=true;
 }
 return found?val+group:null;
}
function interpret(source){
 const original=String(source||'').trim(),s=strip(original);if(!s)return {ok:false,error:'Não ouvi nenhuma medida.'};

 if(/^(?:confirmar|confirma|confirmado|salvar|ok|sim|isso|correto|certo|pode confirmar|pode salvar)$/.test(command))return {command:'confirm'};
 if(/^(?:nao|errado|incorreto|corrigir|refazer|nova medida)$/.test(command))return {command:'reject'};
 if(/^(?:parar|parar medicao|encerrar|encerrar medicao)$/.test(command))return {command:'stop'};
 if(/^(?:repetir|apagar|tentar de novo)$/.test(command))return {command:'repeat'};

 let cota=null,text=command;
 const cmatch=text.match(/^(?:cota|numero)\s+(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\s*[,:-]?\s*(.*)$/);

 if(!text)return {ok:false,error:'Fale a medida após a identificação da cota.'};
 // Read metres first, then convert any remaining centimetres or millimetres.
 let cm=null,assumed=false,reason='';
 const metre=text.match(/^(.*?)\s*\b(metro|metros|m)\b(?:\s+(.*))?$/);
 if(metre){
  let m=quantity(metre[1]),tail=(metre[3]||'').replace(/^e\s+/,'').trim();
  if(m==null&&strip(metre[1])==='meio')m=.5;
  if(m==null)return{ok:false,error:'Não consegui entender o número de metros.'};
  cm=m*100;
  if(tail){
   const mm=tail.match(/^(.*?)\s*\b(milimetro|milimetros|mm)\b$/);
   const cc=tail.match(/^(.*?)\s*\b(centimetro|centimetros|cm)\b$/);
   if(mm){let n=quantity(mm[1]);if(n==null)return{ok:false,error:'Não entendi os milímetros.'};cm+=n/10;}
   else if(cc){let n=quantity(cc[1]);if(n==null)return{ok:false,error:'Não entendi os centímetros.'};cm+=n;}
   else if(tail==='meio'||tail==='meia'){cm+=50;}
   else {let n=quantity(tail);if(n==null)return{ok:false,error:'Não entendi a parte final da medida.'};cm+=n;if(n<10){assumed=true;reason='Interpretei a parte final como centímetros; confirme os algarismos.'}}
  }
 }else{
  const mm=text.match(/^(.*?)\s*\b(milimetro|milimetros|mm)\b$/);
  const cc=text.match(/^(.*?)\s*\b(centimetro|centimetros|cm)\b$/);
  if(mm){let v=quantity(mm[1]);if(v==null)return{ok:false,error:'Milímetros não reconhecidos.'};cm=v/10;}
  else if(cc){let v=quantity(cc[1]);if(v==null)return{ok:false,error:'Centímetros não reconhecidos.'};cm=v;}
  else{
   let decimal=text.match(/^(\d+)[,.](\d+)$/);
   if(decimal&&+decimal[1]<20){cm=Number(text.replace(',','.'))*100;assumed=true;reason='Valor decimal interpretado como metros; confirme.';}
   else if(/^([\w ]+) e ([\w ]+)$/.test(text)){
    let match=text.match(/^([\w ]+) e ([\w ]+)$/),a=quantity(match[1]),b=quantity(match[2]);
    if(a!=null&&a>=1&&a<10&&b!=null&&b>=10&&b<100){cm=a*100+b;assumed=true;reason='Sem unidade: interpretei como metros e centímetros.';}
   }
   if(cm==null){
    let col=text.match(/^([\w]+)\s+(?:e\s+)?(vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)(.*)$/);
    if(col){let a=quantity(col[1]),b=quantity(col[2]+col[3]);if(a!=null&&a>=1&&a<10&&b!=null&&b>=20&&b<100){cm=a*100+b;assumed=true;reason='Interpretei como metros e centímetros. Confirme.'}}
   }
   if(cm==null&&/^(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|[1-9])\s+e\s+(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|[1-9])$/.test(text))return{ok:false,error:'Medida ambígua. Diga a unidade, por exemplo: dois metros e cinco centímetros.'};
   if(cm==null){let v=quantity(text);if(v==null)return{ok:false,error:'Não reconheci uma medida válida. Tente falar com a unidade.'};cm=v/10;assumed=true;reason='Sem unidade: considerei milímetros; confirme o valor.';}
  }
 }
 if(!Number.isFinite(cm)||cm<=0||cm>10000)return{ok:false,error:'A medida está fora do intervalo esperado.'};

 return {ok:true,cm,source:original,cota,assumed,reason};
}

function askDim(){let d=chosenDim();if(!voiceRunning||!d){voicePause();return}voiceConfirming=false;let cat=page==='paredes'?(d.section||d.layer):page==='bancadas'?(benchView==='planta'?'planta da bancada':'elevação da bancada'):null;let categoryNames={interferencias:'interferências',ar:'ar-condicionado',portas:'portas',janelas:'janelas',pontos:'pontos técnicos',manuais:'cotas manuais'};let intro=cat!==voiceLastCategory?(cat?(page==='paredes'?'Vamos iniciar as cotas de '+(categoryNames[cat]||cat)+'. ':'Vamos medir a '+cat+'. '):'') :'';voiceLastCategory=cat;voiceSay(intro+'Cota '+d.id+'. '+d.label+'. Diga a medida.',()=>listenRecognition())}
