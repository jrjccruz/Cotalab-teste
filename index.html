function roomDims(){return S.dims.filter(d=>d.scope==='room:'+S.currentRoomId)}
function ensureRoomDims(){
 if(!S.closed)return;
 const scope='room:'+S.currentRoomId;
 if(!S.polygonDraft)S.polygonDraft=structuredClone(S.polygon);
 if(!S.dims.some(d=>d.scope===scope&&d.metric==='roomPe'))addDim({scope,owner:S.currentRoomId,metric:'roomPe',label:'Pé-direito do ambiente',section:'ambiente',layer:'manuais'});

}
function roomIsReady(){if(!S.closed||S.walls.some(w=>w.reviewRequired))return false;ensureRoomDims();const ds=roomDims();return ds.length===S.walls.length+1&&ds.every(d=>d.value!=null&&d.value>0&&!d.needsReview)}
function measuredWallChain(room){
 const source=room.polygonDraft?.length?room.polygonDraft:room.polygon||[],walls=room.walls||[];
 if(!walls.length||source.length<walls.length)return null;
 let pts=[{x:0,y:0}],known=true;
 for(const w of walls){const a=source[w.i],b=source[w.i+1]||source[0];if(!a||!b)return null;const v=sub(b,a),length=Math.hypot(v.x,v.y)||1;
  const L=Number(w.comprimento)||null;if(!L)known=false;
  const physical=L||length;pts.push(add(pts.at(-1),mul(v,physical/length)));
 }
 const gap=room.openPath?null:Math.hypot(pts.at(-1).x,pts.at(-1).y);
 return {points:pts,residualMM:known?gap:null,allMeasured:known,unresolved:known&&!room.openPath&&gap>.5};
}

 // A planta esquemática continua intacta e editável. NÃO distorcer comprimentos
 // reais para obrigar a soma vetorial a chegar ao ponto inicial.

}

 else if(['width','height','posX','posY'].includes(d.metric)){} // derived contacts are recomputed below.

function roomSnap(p){if(roomDiagonal||!S.polygon.length)return p;let last=S.polygon.at(-1),dx=p.x-last.x,dy=p.y-last.y;return Math.abs(dx)>=Math.abs(dy)?{x:p.x,y:last.y}:{x:last.x,y:p.y}}

function generalRooms(){return roomSequence()}
function generalRoom(id){return id===S.currentRoomId?roomSnapshot():S.savedRooms.find(r=>r.id===id)}
function generalBounds(poly){let x=poly.map(p=>p.x),y=poly.map(p=>p.y);return {minX:Math.min(...x),minY:Math.min(...y),maxX:Math.max(...x),maxY:Math.max(...y)}}
function generalPosition(room,index){if(!S.planPositions)S.planPositions={};const v=S.planPositions[room.id];if(v&&Number.isFinite(v.x)&&Number.isFinite(v.y))return v;const pos={x:90+(index%3)*280,y:95+Math.floor(index/3)*210};S.planPositions[room.id]=pos;return pos}
function generalScale(id){return Math.max(.01,Number(S.planScales?.[id])||1)}
function generalWorldPoly(room,index){const b=generalBounds(room.polygon),pos=generalPosition(room,index),scale=generalScale(room.id);return room.polygon.map(p=>({x:(p.x-b.minX)*scale+pos.x,y:(p.y-b.minY)*scale+pos.y}))}

/* Assistente V10: nomes unívocos e identificação estável. */
function voiceNormalize(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ').replace(/\b(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\b/g,v=>({um:'1',uma:'1',dois:'2',duas:'2',tres:'3',quatro:'4',cinco:'5',seis:'6',sete:'7',oito:'8',nove:'9',dez:'10'}[v]))}
function allNamedRooms(){return roomSequence(true).map(r=>({id:r.id,name:S.roomNames?.[r.id]||r.ambiente||'Ambiente'}))}
function properRoomName(value){const a=String(value||'Ambiente').trim().replace(/\s+/g,' ');return a?a.charAt(0).toLocaleUpperCase('pt-BR')+a.slice(1):'Ambiente'}
function uniqueRoomLabel(wish,id){
 const wanted=properRoomName(wish);
 const taken=new Set(allNamedRooms().filter(x=>x.id!==id).map(x=>voiceNormalize(x.name)));
 if(!taken.has(voiceNormalize(wanted)))return wanted;
 const base=wanted.replace(/\s+\d+$/,'').trim()||'Ambiente';let idx=1;
 while(taken.has(voiceNormalize(base+' '+idx)))idx++;
 return base+' '+idx;
}
function renameRoomUnique(id,wish){
 let name,base=properRoomName(wish);
 const existing=allNamedRooms().find(r=>r.id!==id&&voiceNormalize(r.name)===voiceNormalize(base));
 if(existing&&!/\s+\d+$/.test(base)&&!allNamedRooms().some(r=>r.id!==existing.id&&voiceNormalize(r.name)===voiceNormalize(base+' 1'))){
  // Two equal names become Cozinha 1 / Cozinha 2. Internal IDs are unchanged.
  S.roomNames[existing.id]=base+' 1';
  if(existing.id===S.currentRoomId)S.meta.ambiente=base+' 1';
  else{const previous=S.savedRooms.find(r=>r.id===existing.id);if(previous)previous.ambiente=base+' 1'}
  name=uniqueRoomLabel(base+' 2',id);
 }else name=uniqueRoomLabel(base,id);
 S.roomNames[id]=name;
 if(id===S.currentRoomId)S.meta.ambiente=name;
 else {let room=S.savedRooms.find(r=>r.id===id);if(room)room.ambiente=name;}
 return name;
}
function findRoomBySpokenName(text,rooms){
 const spoken=voiceNormalize(text);const candidates=(rooms||[]).filter(r=>r?.id&&r?.name).map(r=>({r,n:voiceNormalize(r.name)}));
 let full=candidates.filter(x=>x.n&&(' '+spoken+' ').includes(' '+x.n+' '));
 if(full.length===1)return full[0].r;
 if(full.length>1){full.sort((a,b)=>b.n.length-a.n.length);if(full[0].n.length!==full[1].n.length)return full[0].r;return null;}
 // Do not guess when more than one numbered room shares the base name.
 const compact=spoken.replace(/\b(ambiente|paredes|parede|medir|medicao|medidas|levantar|levantamento|iniciar|comecar|vamos|quero|do|da|de|no|na|o|a|por|favor|para|proximo|agora)\b/g,' ').replace(/\s+/g,' ').trim();
 if(!compact)return null;
 const similar=candidates.filter(x=>x.n===compact||x.n.replace(/\s+\d+$/,'')===compact);
 return similar.length===1?similar[0].r:null;
}
/* Comandos compartilhados do tablet e celular; qualquer etapa pode pedir outra atividade.
 * Priorizar comandos explícitos antes de tratar texto como número ou nome.
 * Nomes de ambientes são reconhecidos por ID/nome; nenhuma suposição de cômodo.
 */
function voiceIntent(raw,rooms){
 const t=voiceNormalize(raw),room=findRoomBySpokenName(raw,rooms),has=re=>re.test(t);
 let action=null;
 if(has(/\b(cancelar|desistir) (?:o )?novo levantamento\b/))action='manual-cancel';
 else if(has(/\b(finalizar assistente|encerrar assistente|encerrar sessao de voz)\b/))action='finish-assistant';
 else if(has(/\b(novo levantamento|novo projeto|comecar outro cliente|iniciar outro levantamento)\b/))action='new-survey';
 else if(has(/\b(editar cadastro|abrir cadastro|mostrar cadastro|voltar (?:ao|para o) cadastro|dados da obra|cadastro do levantamento)\b/))action='cadastro';
 else if(has(/\b(meus projetos|projetos salvos|abrir projetos)\b/))action='projects';
 else if(has(/\b(abrir|carregar|reabrir) (?:o )?projeto\b/))action='manual-project';
 else if(has(/\b(sair da tela cheia|fechar tela cheia|voltar da tela cheia)\b/))action='fullscreen-off';
 else if(has(/\b(entrar em tela cheia|abrir em tela cheia|mostrar tela cheia)\b/))action='fullscreen-on';
 else if(has(/\b(selecionar|modo selecionar|ferramenta selecao)\b/) && !room)action='select-tool';
 else if(has(/\b(mover ambiente|modo mover|ferramenta mover)\b/))action='move-tool';
 else if(has(/\b(aproximar|aumentar zoom|zoom mais)\b/))action='zoom-in';
 else if(has(/\b(afastar|diminuir zoom|zoom menos)\b/))action='zoom-out';
 else if(has(/\b(enquadrar planta|mostrar planta inteira)\b/))action='fit-plan';

/* CotaLab 12.9: auditoria dimensional não destrutiva. Arquivos .cotalab de segurança
   permanecem disponíveis mesmo com cotas pendentes; PDFs/JSONs finais não. */
function measurementIssues(){
 if(S.closed)ensureRoomDims();
 const result=[];
 for(const r of generalRooms().filter(x=>x.polygon?.length>=2)){
  const ds=r.dims||[],name=generalName(r),base={roomId:r.id,room:name};
  const issue=(label,detail,dim=null)=>result.push({...base,label,detail,dimId:dim?.id||null,scope:dim?.scope||null});
  if(!r.closed)issue('Planta não concluída','Concluir desenho do ambiente');
  const pe=ds.find(d=>d.metric==='roomPe'&&d.scope==='room:'+r.id);
  if(!pe||!(pe.value>0)||pe.needsReview)issue('Pé-direito','Medida não confirmada',pe);
  for(const w of r.walls||[]){
   const d=ds.find(x=>x.metric==='roomLength'&&x.owner===w.id);
   if(!d||!(d.value>0)||d.needsReview||w.reviewRequired)issue('Parede '+w.letra,'Comprimento não confirmado',d);
   const pending=(w.items||[]).filter(o=>o.pending===true);
   for(const o of pending)issue('Parede '+w.letra+' · '+(o.subtype||'ocorrência'), 'Cadastro/enquadramento incompleto');
  }
  const ids=new Set(result.filter(x=>x.roomId===r.id&&x.dimId!=null).map(x=>x.dimId));
  for(const d of ds){
   if(d.metric==='roomPe'||d.metric==='roomLength')continue;
   if(d.value>0&&!d.needsReview)continue;
   if(ids.has(d.id))continue;
   const w=(r.walls||[]).find(x=>d.scope==='photo:'+x.id||d.owner===x.id);
   const b=(r.benches||[]).find(x=>String(d.scope||'').startsWith('bench:'+x.id+':'));
   const obj=w?.items?.find(x=>x.id===d.owner);
   const prefix=w?'Parede '+w.letra+(obj?' · '+(obj.subtype||'ocorrência'):''):b?'Bancada '+((r.benches||[]).indexOf(b)+1):'Ambiente';
   issue(prefix+' · cota '+d.id+' · '+d.label,'Medida obrigatória não confirmada',d);
  }
  for(const b of r.benches||[]){
   const idx=(r.benches||[]).indexOf(b)+1;
   if(b.soco){let sd=ds.find(x=>x.owner===b.id&&x.metric==='socoAlt');if(!sd)issue('Bancada '+idx+' · soco','Altura obrigatória não cadastrada');
    // recuo de soco é uma dimensão técnica: exigir valor positivo confirmado, inclusive legado com default de 70 mm
    if(!(b.socoRecuo>0)||!b.socoRecuoConfirmed)issue('Bancada '+idx+' · soco','Recuo do soco ainda não confirmado');
   }
   if(b.ilhargas>0&&!ds.some(x=>x.owner===b.id&&x.metric==='ilhargaEsp'))issue('Bancada '+idx+' · ilharga','Espessura obrigatória não cadastrada');
  }
 }
 return result;
}

function strip(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9,.\s-]/g,' ').replace(/\s+/g,' ').trim()}
const small={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezassete:17,dezessete:17,dezoito:18,dezenove:19};

const hundreds={cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,oitocentos:800,oitocentas:800,novecentos:900,novecentas:900};
function quantity(raw){
 let s=strip(raw).replace(/\b(de|da|do|a|ate|com|uns|aproximadamente)\b/g,' ').replace(/\s+/g,' ').trim();
 if(!s)return null;

 if(spokenDecimal){let int=quantity(spokenDecimal[1]),fraction=quantity(spokenDecimal[2]);
   if(int!=null&&fraction!=null){let words=spokenDecimal[2].split(/\s+/),leadZero=words[0]==='zero'?1:0;
    let digits=String(Math.floor(fraction)).length+leadZero;return int+fraction/Math.pow(10,Math.max(1,digits));}}

 let tokens=s.split(/\s+/),val=0,group=0,found=false;

function interpret(source){

 const cmatch=text.match(/^(?:cota|numero)\s+(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\s*[,:-]?\s*(.*)$/);

  if(m==null&&strip(metre[1])==='meio')m=.5;
  if(m==null)return{ok:false,error:'Não consegui entender o número de metros.'};
  cm=m*100;
  if(tail){
   const mm=tail.match(/^(.*?)\s*\b(milimetro|milimetros|mm)\b$/);
   const cc=tail.match(/^(.*?)\s*\b(centimetro|centimetros|cm)\b$/);
   if(mm){let n=quantity(mm[1]);if(n==null)return{ok:false,error:'Não entendi os milímetros.'};cm+=n/10;}
   else if(cc){let n=quantity(cc[1]);if(n==null)return{ok:false,error:'Não entendi os centímetros.'};cm+=n;}

  const mm=text.match(/^(.*?)\s*\b(milimetro|milimetros|mm)\b$/);
  const cc=text.match(/^(.*?)\s*\b(centimetro|centimetros|cm)\b$/);
  if(mm){let v=quantity(mm[1]);if(v==null)return{ok:false,error:'Milímetros não reconhecidos.'};cm=v/10;}

   if(decimal&&+decimal[1]<20){cm=Number(text.replace(',','.'))*100;assumed=true;reason='Valor decimal interpretado como metros; confirme.';}

   }
   if(cm==null){
    let col=text.match(/^([\w]+)\s+(?:e\s+)?(vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)(.*)$/);
    if(col){let a=quantity(col[1]),b=quantity(col[2]+col[3]);if(a!=null&&a>=1&&a<10&&b!=null&&b>=20&&b<100){cm=a*100+b;assumed=true;reason='Interpretei como metros e centímetros. Confirme.'}}
   }
   if(cm==null&&/^(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|[1-9])\s+e\s+(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|[1-9])$/.test(text))return{ok:false,error:'Medida ambígua. Diga a unidade, por exemplo: dois metros e cinco centímetros.'};

  }

}

 if(!ar||!br||ar.id===br.id||!v4Finite(L)||L<=0||!v4Finite(t)||t<=0||!v4Finite(aStart)||aStart<0||!v4Finite(bStart)||bStart<0){notify('Selecione paredes de ambientes distintos e informe comprimento, espessura e inícios reais.');return}
 let wa=ar.walls.find(w=>w.id===aId),wb=br.walls.find(w=>w.id===bId);
 if(!wa?.comprimento||!wb?.comprimento||aStart+L>wa.comprimento+1e-5||bStart+L>wb.comprimento+1e-5){notify('O segmento compartilhado não pode ultrapassar nenhuma das duas paredes medidas.');return}
 if((z0!=null)!==(z1!=null)||z0!=null&&z1<=z0){notify('Informe ambos os limites Z físicos válidos ou deixe ambos pendentes.');return}
 v4SaveSettings();let cfg=v4State();cfg.shared.push({id:uid(),roomA:ar.id,wallA:aId,roomB:br.id,wallB:bId,aStartMM:aStart,bStartMM:bStart,lengthMM:L,thicknessMM:t,bottomZ:z0,topZ:z1,confirmed:true});changed();v4SetupSheet();notify('Vínculo registrado. A exportação validará a compatibilidade geométrica.');
}
/* Exportação alternativa: a mesma medição com ambientes independentes.
 * Não muda nem o cadastro nem as medidas do CotaLab; não cria vínculos falsos.
 * Toda distância entre os subgrupos é exclusivamente para ORGANIZAÇÃO DA PRÉVIA,
 * nunca uma posição de obra. O contrato V4 oficial permanece inalterado. */
function v4CreateIndependentJSON(source){
 const json=JSON.parse(JSON.stringify(source));
 const skipTypes=new Set(['shared_face_pair','shared_wall_thickness','physical_wall_vertical_extent']);
 const skipped=new Set((json.constraints||[]).filter(c=>skipTypes.has(c.type)).map(c=>c.id));
 // Retira dependentes de vínculos físicos removidos, mas NUNCA elimina cotas individuais.
 let grew=true;
 while(grew){grew=false;for(const c of json.constraints||[]){
  if(!skipped.has(c.id)&&(c.depends_on_ids||[]).some(id=>skipped.has(id))){skipped.add(c.id);grew=true;}
 }}
 json.constraints=(json.constraints||[]).filter(c=>!skipped.has(c.id));
 json.shared_wall_segments=[];
 json.junctions=[];
 const valid=v=>typeof v==='number'&&Number.isFinite(v);
 let endX=null,previousWidth=0,previousThick=0;
 for(const env of json.environments){
  const old=env.placement,rotation=valid(old?.provisional_preview?.rotation_hint_deg)?old.provisional_preview.rotation_hint_deg:
   valid(old?.rotation_deg)?old.rotation_deg:0;
  const ang=rotation*Math.PI/180,co=Math.cos(ang),si=Math.sin(ang),pts=[];
  const add=p=>{if(p&&valid(p.x)&&valid(p.y))pts.push({x:co*p.x+si*p.y,y:si*p.x-co*p.y})};
  for(const wall of env.walls||[]){add(wall.start_mm);add(wall.end_mm)}
  for(const bench of env.worktops||[])for(const seg of bench.segments||[]){
   if(valid(seg.start_x_mm)&&valid(seg.start_y_mm))add({x:seg.start_x_mm,y:seg.start_y_mm});
   if(valid(seg.end_x_mm)&&valid(seg.end_y_mm))add({x:seg.end_x_mm,y:seg.end_y_mm});
   for(const p of seg.front_edge_local_mm||[])add(p);
   for(const p of seg.rear_boundary_local_mm||[])add(p);
  }
  if(!pts.length)throw Error('O ambiente '+env.name+' não possui uma parede medida para posicioná-lo na prévia separada.');
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),width=Math.max(0,maxX-minX);
  const thick=Math.max(0,...(env.walls||[]).map(w=>valid(w.thickness_mm)?w.thickness_mm:valid(w.thickness_reference_mm)?w.thickness_reference_mm:0));
  // Espaçamento RESPONSIVO à dimensão dos cômodos: margem apenas visual.
  // Sem "STAGING_GAP_MM=3000" e sem modificar um único comprimento de parede.
  const gap=endX===null?0:Math.max(2*(previousThick+thick),0.15*Math.max(previousWidth,width));
  const originX=(endX===null?0:endX+gap)-minX,originY=-minY;
  endX=originX+maxX;previousWidth=width;previousThick=thick;
  const knownFloor=old?.vertical_status==='resolved'&&valid(env.floor_z_mm),floor=knownFloor?env.floor_z_mm:null;
  env.placement={...old,origin_mm:knownFloor?{x:null,y:null,z:floor}:null,rotation_deg:null,
   status:knownFloor?'partially_resolved':'unresolved',basis:'unknown',horizontal_status:'unresolved',rotation_status:'unresolved',vertical_status:knownFloor?'resolved':'unresolved',
   constraint_ids:(old?.constraint_ids||[]).filter(cid=>!skipped.has(cid)),
   unresolved_reasons:[...new Set([...(old?.unresolved_reasons||[]),'independent_visual_layout_not_surveyed_position'])],
   provisional_preview:{origin_hint:{x:originX,y:originY,z:0},rotation_hint_deg:rotation,source:'schematic',not_for_construction:true}};
  env.resolution_status=knownFloor?'partially_resolved':'unresolved';
  for(const wall of env.walls||[]){
   wall.physical_wall_id=null;
   if(wall.orientation){
    wall.orientation={...wall.orientation,quality:wall.length_mm!=null?'schematic':'unresolved',azimuth_deg:null,
     evidence_ids:[],method:wall.length_mm!=null?'schematic_trace':'unknown'};
   }
  }
 }
 json.construction_manifest=(json.construction_manifest||[]).filter(e=>!['shared_segment','physical_wall'].includes(e.entity_kind)).map(e=>{
  e.evidence_ids=(e.evidence_ids||[]).filter(id=>!skipped.has(id));
  if(e.mode!=='blocked'){
   e.mode='preview_only';
   e.reason_codes=[...new Set([...(e.reason_codes||[]).filter(r=>r!=='shared_physical_wall_owned_separately'),'independent_visual_layout_only'])];
  }
  return e;
 });
 json.meta={...(json.meta||{}),export_variant:'ambientes_independentes',source_survey_id:source.survey_id,
  layout_notice:'Ambientes separados exclusivamente para inspecao; distancias entre ambientes nao foram medidas e nao valem para construcao.',
  connection_policy:'no_shared_wall_segments',visual_separation_basis:'room_bounds_and_proportional_margin_not_surveyed'};
 // IDs de ambiente/parede/cota permanecem estáveis; apenas o ID da importação
 // independente muda, para não sobrescrever a variante conectada no SketchUp.
 json.survey_id=source.survey_id+'__independentes';
 return json;
}
function v4Download(mode='connected'){
 if(measurementIssues().length){showMeasureIssues();return}
 try{
  const {json:connected}=v4ExportData(),independent=mode==='independent',json=independent?v4CreateIndependentJSON(connected):connected;
  if(!independent)json.meta={...json.meta,export_variant:'ambientes_conectados',connection_policy:'confirmed_shared_wall_segments_only'};
  S.exportRevision=connected.revision;changed();
  downloadBlob(JSON.stringify(json,null,2),fileRoot()+(independent?'_StepLink_V4_SEPARADOS.json':'_StepLink_V4_CONECTADOS.json'),'application/json;charset=utf-8');
  notify(independent?'JSON V4 separado: '+json.environments.length+' ambientes independentes; os espaçamentos são SOMENTE visuais.':'JSON V4 conectado: '+json.environments.length+' ambientes, '+json.shared_wall_segments.length+' vínculos físicos confirmados.');
 }catch(e){notify('Falha na exportação V4: '+e.message);console.error(e)}
}
function v4FinalizeRoom(id,done){if(done&&measurementIssues().some(x=>x.roomId===id)){showMeasureIssues('Finalização do ambiente');return}if(done&&photoIssues().some(x=>generalRooms().some(r=>r.id===id&&generalName(r)===x.room))){notify('Ainda há fotografias pendentes neste ambiente. Você pode exportar com aviso, mas não marcar o ambiente como concluído.');return}let v=v4State();commit();v.finalizedRooms[id]=done;changed();render();notify(done?'Ambiente finalizado pelo profissional. Pendências permanecem registradas.':'Ambiente reaberto, sem perda de medidas.');}

 document.addEventListener('change',e=>{let t=e.target;if(!assistRoot()?.contains(t))return;if(t.id==='assist-draw-tool'){assistDrawTool=t.value;assistDrawSelected=null;renderAssist();return}if(t.id==='assist-draw-point'){assistDrawSubtype=t.value;return}if(t.id==='assist-wall'){assistWall=t.value;renderAssist()}else if(t.id==='assist-dim'){assistSelected=Number(t.value);assistDraft=null;assistWaitConfirm=false;assistantSendFocus(assistFlow.task);renderAssist()}else if(t.id==='assist-camera'){assistantLoadPhoto(t.files?.[0])}});
 document.addEventListener('pointerdown',e=>{if(assistRoot()?.contains(e.target))mobilePhotoPointerDown(e)},{passive:false});
 document.addEventListener('pointerup',e=>{if(assistDrawStart)mobilePhotoPointerUp(e)},{passive:false});
 document.addEventListener('pointercancel',()=>{assistDrawStart=null});
 document.addEventListener('keydown',e=>{if(['assist-manual','assist-command'].includes(e.target.id)&&e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();e.target.value='';if(v)assistantReceiveText(v)}});
 assistantStart();
}else{
 try{let prev=JSON.parse(sessionStorage.getItem('cotalab-connect-host')||'null');if(prev?.id&&prev?.token&&Date.now()-(prev.createdAt||Date.now())<43200000){hostSession=prev;startHostPeer().catch(e=>notify('Reconexão automática: '+e.message))}}catch(_){}
}
