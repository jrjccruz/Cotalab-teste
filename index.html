ow,.buttonrow,.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sectionrow{justify-content:space-between;margin-bottom:7px}.sectionrow strong{font-size:14px}.compact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.workspace{position:relative;border-radius:10px;overflow:hidden;background:#ebe7e1;border:1px solid #dbd4cc;min-height:200px;display:flex;align-items:center;justify-content:center;isolation:isolate}.workspace svg{display:block;width:100%;height:auto;max-height:min(65dvh,650px);touch-action:none;user-select:none;-webkit-user-select:none}.workspace.photo{background:#464849}.workspace.photo svg{max-height:68dvh;max-width:100%;width:auto}.toolstrip{display:flex;gap:5px;align-items:center;margin:6px 0;overflow-x:auto;scrollbar-width:none}.toolstrip button{padding:7px 9px;font-size:12px;min-height:33px}.toolstrip .spacer{flex:1}.hint{font-size:11.5px;color:#645b52;background:#ebe6df;padding:6px 8px;border-radius:7px;margin-top:6px;line-height:1.35}.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{min-height:30px;font-size:11.5px;padding:5px 8px}.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.voicebar{background:white;border:1px solid #dfd8cf;border-radius:10px;padding:7px;margin-top:7px}.voicebar .row{justify-content:space-between}.voicebar .voice-actions{display:flex;gap:5px}.voicebar button{font-size:12px;padding:7px 8px}.voicebar .speak{background:#766e64;border-color:#766e64;color:white}.voicebar .voice-state{font-size:11px;color:var(--mute)}.voicebar .live{color:#b65316;font-weight:700}.voicebar .vtarget{font-weight:700;color:#b95111}.voicebar .heard{font-size:11px;color:#776f65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:4px}.voicebar .vmanual{display:flex;gap:4px;margin-top:5px}.voicebar .vmanual input{flex:1;min-height:31px;padding:6px}.voicebar .vmanual button{min-height:31px}.voicebar .vchecks{display:flex;gap:12px;margin-top:5px;flex-wrap:wrap;font-size:11px}.voicebar .vchecks input{width:14px;height:14px}.dimlist{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:7px}.dimlist button{font-size:11px;min-height:29px;padding:5px 8px}.dimlist .ready{color:var(--green)}.titleline{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:6px}.titleline h2{font-size:15px;margin:0}.wallgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:5px;margin:6px 0}.wallcard{font-size:12px;text-align:left;white-space:normal}.wallcard b{display:block}.wallcard small{font-size:10px;color:var(--mute)}.bottomsheet{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:env(safe-area-inset-bottom,0px);width:min(calc(100% - 12px),520px);background:white;border:1px solid #d1c8be;box-shadow:0 -6px 28px #0003;border-radius:15px 15px 7px 7px;padding:11px;max-height:65dvh;overflow:auto}.sheettitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheettitle strong{font-size:14px}.sheettitle button{min-height:29px;padding:4px 8px}.sheetcontent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.sheetcontent .wide{grid-column:1/-1}.sheetactions{display:flex;gap:5px;margin-top:10px;justify-content:flex-end}.overlay{position:fixed;inset:0;background:#0002;z-index:29}.subnav{display:flex;gap:5px}.subnav button{flex:1}.helpgrid{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.helpgrid span{font-size:10px;padding:3px 6px;border-radius:5px;background:#eee8e0}.notice{border-left:3px solid var(--orange);background:#fff6e9;font-size:11px;padding:7px 9px;margin:6px 0;border-radius:3px}.exportrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.exportrow button{flex:1}.muted{color:var(--mute)}.filebtn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border:1px solid #d5cec6;border-radius:8px;background:white;min-height:3 </style></head><body>
<main class="app">
<div class="topbar"><div class="logo"><b>◈</b> CotaLab <span class="tiny">· Levantamento</span></div><div class="topright"><span class="status" id="save-status">Local</span><button class="iconbtn" id="helpbtn" title="Como usar">?</button></div></div>
<nav class="nav" id="nav"><button data-page="inicio" class="active">Ambiente</button><button data-page="paredes">Paredes</button><button data-page="bancadas">Bancadas</button><button data-page="exportar">Exportar</button></nav>
<div id="page"></div>
<section class="voicebar" id="voicebar"><div class="row"><div><span class="vtarget" id="vtarget">Cotas pendentes</span> <span class="voice-state" id="vstatus">Pronto</span></div><div class="voice-actions"><button id="voice-go" class="speak">🎙 Iniciar</button><button id="voice-confirm" disabled>✓</button><button id="voice-reject" disabled>↺</button></div></div><div class="heard" id="vheard">Selecione uma cota ou comece a sequência de medição.</div><div class="vmanual"><input id="voice-manual" placeholder="Medida ou comando (ex.: 850, sim)" inputmode="text"><button id="voice-send">Enviar</button></div><div class="vchecks"><label class="checkrow"><input type="checkbox" id="handsfree" checked> Mãos livres</label><label class="checkrow"><input type="checkbox" id="voice-sound" checked> Falar</label></div><div class="dimlist" id="dimlist"></div></section>
<div class="notice" id="notice">Desenhe o ambiente na planta. As medidas reais são registradas em milímetros.</div>
</main><div class="overlay hidden" id="overlay"></div><div class="bottomsheet hidden" id="sheet"></div><div class="printonly" id="printarea"></div>
<script>

'use strict';
const $=s=>document.querySelector(s), el=(tag,attrs={},text='')=>{let x=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));x.textContent=text;return x};
const uid=()=>Math.random().toString(36).slice(2,10), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>Number.isFinite(Number(x))?Number(x):0, mm=x=>Math.max(0,Math.round(n(x)*10)/10), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), num=x=>Number.isFinite(n(x))?n(x).toLocaleString('pt-BR',{maximumFractionDigits:1}):'—';
const defaultState=()=>({version:2,meta:{profissional:'',cliente:'',obra:'',ambiente:'Cozinha',pe:2700,paredeTipo:'Alvenaria',espessura:150},polygon:[],closed:false,walls:[],benches:[],dims:[],nextDim:1});
let S;try{S=JSON.parse(localStorage.getItem('cotalab_project_v2'))||defaultState()}catch(_){S=defaultState()}if(!S.version||S.version!==2)S=defaultState();
let page='inicio',currentWall=null,currentBench=null,benchView='planta',tool='idle',gesture=null,activeDim=null,activeObject=null,wallLayer={pontos:true,aberturas:true,interferencias:true,manuais:true},history=[],toastTimer=null,pendingSheet=false;
let photoCache={};const DB_NAME='CotaLabFotos2';let database=null;
function openDB(){return new Promise(res=>{if(!indexedDB)return res(null);let r;try{r=indexedDB.open(DB_NAME,1)}catch(e){return res(null)}r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>{database=r.result;res(database)};r.onerror=()=>res(null)})}
async function dbGet(key){if(!database)return null;return new Promise(res=>{const q=database.transaction('fotos').objectStore('fotos').get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
function dbPut(key,val){if(!database)return;try{database.transaction('fotos','readwrite').objectStore('fotos').put(val,key)}catch(_){}}
const save=()=>{try{localStorage.setItem('cotalab_project_v2',JSON.stringify(S));$('#save-status').textContent='Salvo neste aparelho'}catch(e){$('#save-status').textContent='Armazenamento cheio';notify('Não foi possível salvar. Exporte o JSON para conservar as medidas.')}};
let saveTimer=null;function changed(){clearTimeout(saveTimer);saveTimer=setTimeout(save,130)}
function commit(){history.push(JSON.stringify(S));if(history.length>35)history.shift();changed()}
function undo(){if(!history.length){notify('Nada para desfazer.');return}S=JSON.parse(history.pop());currentWall=S.walls.some(w=>w.id===currentWall)?currentWall:S.walls[0]?.id;currentBench=S.benches.some(b=>b.id===currentBench)?currentBench:S.benches[0]?.id;changed();render()}
function notify(text){$('#notice').textContent=text}
const svgP=(a)=>a.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), mul=(a,k)=>({x:a.x*k,y:a.y*k}), dot=(a,b)=>a.x*b.x+a.y*b.y;
function nearestSegment(p,a,b){let v=sub(b,a),t=clamp(dot(sub(p,a),v)/(dot(v,v)||1),0,1);return {p:add(a,mul(v,t)),d:d2(p,add(a,mul(v,t))),t}}
const wallName=i=>String.fromCharCode(65+(i%26));
function planeWall(p){let found=null;S.walls.forEach(w=>{const a=S.polygon[w.i],b=S.polygon[(w.i+1)%S.polygon.length];if(!a||!b)return;const t=nearestSegment(p,a,b);if(!found||t.d<found.d)found={...t,wall:w}});return found}
function syncWalls(){if(!S.closed)return;S.walls=S.polygon.map((p,i)=>{let old=S.walls.find(w=>w.i===i);return old||{id:uid(),i,letra:wallName(i),comprimento:0,pe:null,tipo:null,espessura:null,quad:null,items:[],photo:false,photoH:650}})}
function addDim({scope,label,kind='auto',owner=null,metric=null,view=null,geom=null,layer='manuais',value=null,ref=null,orientation=null}){let d={id:S.nextDim++,scope,label,kind,owner,metric,view,geom,layer,value:mm(value)||null,labelSide:1,ref,orientation};S.dims.push(d);return d}
function dimVal(id){return S.dims.find(x=>x.id===id)?.value||null}
function dimByOwner(owner,metric){return S.dims.find(x=>x.owner===owner&&x.metric===metric)}
function dimScope(){return page==='paredes'?'photo:'+currentWall:page==='bancadas'?'bench:'+currentBench+':'+benchView:null}
function visibleDims(){let scope=dimScope();return S.dims.filter(d=>d.scope===scope&&(page!=='paredes'||wallLayer[d.layer]!==false))}
function editDim(d,val){d.value=val?mm(val):null;changed();render();}
function loadUi(){const nav=$('#nav');nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#voicebar').classList.toggle('hidden',page==='inicio'||page==='exportar');}
function pageTo(p){page=p;tool='idle';activeDim=null;activeObject=null;closeSheet();if(page==='paredes'&&!currentWall)currentWall=S.walls[0]?.id||null;if(page==='bancadas'&&!currentBench)currentBench=S.benches[0]?.id||null;render()}
function setSheet(title,html,onBind=null){const sh=$('#sheet');$('#overlay').classList.remove('hidden');sh.classList.remove('hidden');sh.innerHTML=`<div class="sheettitle"><strong>${esc(title)}</strong><button data-close>✕</button></div>${html}`;if(onBind)onBind(sh)}
function closeSheet(){$('#sheet').classList.add('hidden');$('#overlay').classList.add('hidden')}
function envDefaults(amb){return /cozinha|banheiro|lavabo|gourmet|serviço|servico|varanda/i.test(amb)}
function render(){loadUi();const target=$('#page');if(page==='inicio')target.innerHTML=homeHTML();if(page==='paredes')target.innerHTML=wallsHTML();if(page==='bancadas')target.innerHTML=benchesHTML();if(page==='exportar')target.innerHTML=exportHTML();paintVoice()}
function homeHTML(){let m=S.meta;return `<section class="panel"><div class="titleline"><h2>Dados do levantamento</h2><span class="tiny">Preencha uma vez</span></div><div class="compact"><label class="field"><span>Profissional</span><input data-meta="profissional" value="${esc(m.profissional)}" placeholder="Quem está medindo"></label><label class="field"><span>Cliente</span><input data-meta="cliente" value="${esc(m.cliente)}" placeholder="Nome do cliente"></label><label class="field"><span>Obra / apartamento</span><input data-meta="obra" value="${esc(m.obra)}" placeholder="Identificação"></label><label class="field"><span>Ambiente</span><select data-meta="ambiente">${['Cozinha','Banheiro','Lavabo','Área de serviço','Área gourmet','Varanda','Quarto','Sala','Escritório','Outro'].map(v=>`<option ${m.ambiente===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Pé-direito (mm)</span><input type="number" data-meta="pe" value="${esc(m.pe)}" inputmode="decimal"></label><label class="field"><span>Estrutura padrão</span><select data-meta="paredeTipo">${['Alvenaria','Drywall','Outra'].map(v=>`<option ${m.paredeTipo===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Espessura (mm)</span><input type="number" data-meta="espessura" value="${esc(m.espessura)}" inputmode="decimal"></label></div></section>
<section class="panel"><div class="sectionrow"><strong>Planta do ambiente</strong><span class="tiny">${S.closed?S.walls.length+' paredes':'Toque nos cantos'}</span></div><div class="workspace" id="plan-wrap">${planSVG()}</div><div class="toolstrip"><button data-act="plan-draw" class="${tool==='room'?'active':''}">+ Cantos</button><button data-act="plan-undo">↶ Ponto</button><button data-act="plan-close" ${S.polygon.length<3||S.closed?'disabled':''}>Concluir</button><button data-act="plan-reset">Limpar</button></div><div class="hint">${S.closed?'Toque na letra de uma parede para editar suas medidas. A bancada pode ser traçada nesta planta.':'Toque nos cantos da planta em sequência. Conclua após marcar o último canto. Desenho esquemático: as medidas reais prevalecem.'}</div></section>
${S.closed?`<section class="panel"><div class="sectionrow"><strong>Medidas das paredes</strong><span class="tiny">mm · face interna acabada</span></div><div class="wallgrid">${S.walls.map(w=>`<button class="wallcard" data-wallmeta="${w.id}"><b>Parede ${esc(w.letra)}</b><small>${w.comprimento?num(w.comprimento)+' mm':'Informar comprimento'} · ${esc(w.tipo||m.paredeTipo)}</small></button>`).join('')}</div><div class="toolstrip"><button data-act="bench-trace" class="${tool==='benchpath'?'active':''}">+ Bancada</button><button data-act="bench-island" class="${tool==='island'?'active':''}">+ Ilha</button><button data-act="bench-done" ${!['benchpath','island'].includes(tool)?'disabled':''}>Concluir bancada</button><button data-act="bench-undo" ${!['benchpath','island'].includes(tool)?'disabled':''}>↶ Ponto</button></div><div class="hint">Bancada: toque nas quinas traseiras e continue pelos trechos. A profundidade visual é provisória. Ilha: arraste um retângulo livre. Vinculação com as paredes é registrada automaticamente.</div>${S.benches.length?`<div class="chips">${S.benches.map((b,i)=>`<button data-bench-open="${b.id}">Bancada ${i+1} · ${benchType(b)}</button>`).join('')}</div>`:''}</section>`:''}
<div class="buttonrow"><button class="primary" data-page="paredes" ${!S.closed?'disabled':''}>Seguir: paredes →</button></div>`}
function planSVG(){let pts=S.polygon,poly=pts.length?svgP(pts):'',frame=`<rect width="720" height="470" fill="#f9f7f4"/><defs><pattern id="pgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" stroke="#d7d0c8" stroke-width=".6" fill="none"/></pattern></defs><rect width="720" height="470" fill="url(#pgrid)"/>`;
if(pts.length){frame+=`<polyline points="${poly}${S.closed?' '+pts[0].x+','+pts[0].y:''}" fill="${S.closed?'#aea49714':'none'}" stroke="#736b62" stroke-width="4" stroke-linejoin="round"/>`;pts.forEach((p,i)=>{frame+=`<circle data-plan-vertex="${i}" cx="${p.x}" cy="${p.y}" r="7" fill="${S.closed?'#766e64':'#ed6d08'}" stroke="white" stroke-width="2"/>`});if(S.closed)S.walls.forEach(w=>{let a=pts[w.i],b=pts[(w.i+1)%pts.length],c=mul(add(a,b),.5);frame+=`<g data-plan-wall="${w.id}"><circle cx="${c.x}" cy="${c.y}" r="16" fill="white" stroke="#c8b7a9" stroke-width="1.5"/><text x="${c.x}" y="${c.y+5}" text-anchor="middle" font-size="15" font-weight="750" fill="#6d5d50">${esc(w.letra)}</text></g>`})}
S.benches.forEach((b,i)=>{frame+=benchInPlan(b,i)});
if(benchDraft.length){frame+=`<polyline points="${svgP(benchDraft)}" fill="none" stroke="#ed6d08" stroke-width="5" stroke-dasharray="8 5"/>`;benchDraft.forEach(p=>frame+=`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#ed6d08"/>`)}
return `<svg id="plan-svg" viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg">${frame}</svg>`}
let benchDraft=[];
function polygonArea(poly){return poly.reduce((s,p,i)=>{let q=poly[(i+1)%poly.length];return s+(p.x*q.y-q.x*p.y)},0)/2}
function centroid(poly){return mul(poly.reduce((a,p)=>add(a,p),{x:0,y:0}),1/Math.max(1,poly.length))}
function lineCross(p,r,q,s){let det=r.x*s.y-r.y*s.x;if(Math.abs(det)<.00001)return null;let qp=sub(q,p),t=(qp.x*s.y-qp.y*s.x)/det;return add(p,mul(r,t))}
function benchLinePoly(path,depth=32){
 if(path.length<2)return null;
 const ctr=centroid(S.polygon.length?S.polygon:path),segs=[];
 for(let i=0;i<path.length-1;i++){
   let a=path[i],b=path[i+1],v=sub(b,a),len=Math.hypot(v.x,v.y)||1;
   let normal={x:-v.y/len,y:v.x/len};
   if(dot(normal,sub(ctr,mul(add(a,b),.5)))<0)normal=mul(normal,-1);
   segs.push({v,normal});
 }
 let inside=[];
 for(let i=0;i<path.length;i++){
   if(i===0){inside.push(add(path[i],mul(segs[0].normal,depth)));continue}
   if(i===path.length-1){inside.push(add(path[i],mul(segs.at(-1).normal,depth)));continue}

function strip(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9,.\s-]/g,' ').replace(/\s+/g,' ').trim()}
const small={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezassete:17,dezessete:17,dezoito:18,dezenove:19};
const tens={vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90};
const hundreds={cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,oitocentos:800,oitocentas:800,novecentos:900,novecentas:900};
function quantity(raw){
 let s=strip(raw).replace(/\b(de|da|do|a|ate|com|uns|aproximadamente)\b/g,' ').replace(/\s+/g,' ').trim();
 if(!s)return null;
 const spokenDecimal=s.match(/^(.+?)\s+virgula\s+(.+)$/);
 if(spokenDecimal){let int=quantity(spokenDecimal[1]),fraction=quantity(spokenDecimal[2]);
   if(int!=null&&fraction!=null){let words=spokenDecimal[2].split(/\s+/),leadZero=words[0]==='zero'?1:0;
    let digits=String(Math.floor(fraction)).length+leadZero;return int+fraction/Math.pow(10,Math.max(1,digits));}}
 if(/^\d+(?:[,.]\d+)?$/.test(s))return Number(s.replace(',','.'));
 if(/^([\w ]+) e mei[oa]$/.test(s)){let b=quantity(s.replace(/ e mei[oa]$/,''));return b==null?null:b+.5;}
 let tokens=s.split(/\s+/),val=0,group=0,found=false;
 for(let t of tokens){if(t==='e')continue;
  if(t==='mil'){group=(group||1)*1000;val+=group;group=0;found=true;continue}
  let n=small[t]??tens[t]??hundreds[t];if(n===undefined)return null;
  group+=n;found=true;
 }
 return found?val+group:null;
}
function interpret(source){
 const original=String(source||'').trim(),s=strip(original);if(!s)return {ok:false,error:'Não ouvi nenhuma medida.'};
 const command=s.replace(/^(?:por favor |coloque |anote |mede |medida |valor )+/,'');
 if(/^(?:confirmar|confirma|confirmado|salvar|ok|sim|isso|correto|certo|pode confirmar|pode salvar)$/.test(command))return {command:'confirm'};
 if(/^(?:nao|errado|incorreto|corrigir|refazer|nova medida)$/.test(command))return {command:'reject'};
 if(/^(?:parar|parar medicao|encerrar|encerrar medicao)$/.test(command))return {command:'stop'};
 if(/^(?:repetir|apagar|tentar de novo)$/.test(command))return {command:'repeat'};
 if(/^(?:proxima|pular|avancar)$/.test(command))return {command:'skip'};
 let cota=null,text=command;
 const cmatch=text.match(/^(?:cota|numero)\s+(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\s*[,:-]?\s*(.*)$/);
 if(cmatch){let q=quantity(cmatch[1]);if(Number.isInteger(q)&&q>0)cota=q;text=cmatch[2]}
 text=text.replace(/^(?:mede|medindo|valor|e|de|com|sao|da|deu|ficou|tem|aproximadamente)\s+/,'').trim();
 if(!text&&cota)return{command:'select',cota};
 if(!text)return {ok:false,error:'Fale a medida após a identificação da cota.'};
 // Read metres first, then convert any remaining centimetres or millimetres.
 let cm=null,assumed=false,reason='';
 const metre=text.match(/^(.*?)\s*\b(metro|metros|m)\b(?:\s+(.*))?$/);
 if(metre){
  let m=quantity(metre[1]),tail=(metre[3]||'').replace(/^e\s+/,'').trim();
  if(m==null&&strip(metre[1])==='meio')m=.5;
  if(m==null)return{ok:false,error:'Não consegui entender o número de metros.'};
  cm=m*100;
  if(tail){
   const mm=tail.match(/^(.*?)\s*\b(milimetro|milimetros|mm)\b$/);
   const cc=tail.match(/^(.*?)\s*\b(centimetro|centimetros|cm)\b$/);
   if(mm){let n=quantity(mm[1]);if(n==null)return{ok:false,error:'Não entendi os milímetros.'};cm+=n/10;}
   else if(cc){let n=quantity(cc[1]);if(n==null)return{ok:false,error:'Não entendi os centímetros.'};cm+=n;}
   else if(tail==='meio'||tail==='meia'){cm+=50;}
   else {let n=quantity(tail);if(n==null)return{ok:false,error:'Não entendi a parte final da medida.'};cm+=n;if(n<10){assumed=true;reason='Interpretei a parte final como centímetros; confirme os algarismos.'}}
  }
 }else{
  const mm=text.match(/^(.*?)\s*\b(milimetro|milimetros|mm)\b$/);
  const cc=text.match(/^(.*?)\s*\b(centimetro|centimetros|cm)\b$/);
  if(mm){let v=quantity(mm[1]);if(v==null)return{ok:false,error:'Milímetros não reconhecidos.'};cm=v/10;}
  else if(cc){let v=quantity(cc[1]);if(v==null)return{ok:false,error:'Centímetros não reconhecidos.'};cm=v;}
  else{
   let decimal=text.match(/^(\d+)[,.](\d+)$/);
   if(decimal&&+decimal[1]<20){cm=Number(text.replace(',','.'))*100;assumed=true;reason='Valor decimal interpretado como metros; confirme.';}
   else if(/^([\w ]+) e ([\w ]+)$/.test(text)){
    let match=text.match(/^([\w ]+) e ([\w ]+)$/),a=quantity(match[1]),b=quantity(match[2]);
    if(a!=null&&a>=1&&a<10&&b!=null&&b>=10&&b<100){cm=a*100+b;assumed=true;reason='Sem unidade: interpretei como metros e centímetros.';}
   }
   if(cm==null){
    let col=text.match(/^([\w]+)\s+(?:e\s+)?(vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)(.*)$/);
    if(col){let a=quantity(col[1]),b=quantity(col[2]+col[3]);if(a!=null&&a>=1&&a<10&&b!=null&&b>=20&&b<100){cm=a*100+b;assumed=true;reason='Interpretei como metros e centímetros. Confirme.'}}
   }
   if(cm==null&&/^(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|[1-9])\s+e\s+(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|[1-9])$/.test(text))return{ok:false,error:'Medida ambígua. Diga a unidade, por exemplo: dois metros e cinco centímetros.'};
   if(cm==null){let v=quantity(text);if(v==null)return{ok:false,error:'Não reconheci uma medida válida. Tente falar com a unidade.'};cm=v/10;assumed=true;reason='Sem unidade: considerei milímetros; confirme o valor.';}
  }
 }
 if(!Number.isFinite(cm)||cm<=0||cm>10000)return{ok:false,error:'A medida está fora do intervalo esperado.'};
 cm=Math.round(cm*100)/100;
 return {ok:true,cm,source:original,cota,assumed,reason};
}

let voiceTarget=null,voiceDraft=null,microphone=null,voiceSpeaking=false,voiceListening=false,voiceRunning=false,voiceConfirming=false,voiceError='',voiceGen=0,restartCount=0,voiceTimer=null,firstGreeting=true,buffer='',bufferTimer=null;
const VoiceSupport=window.SpeechRecognition||window.webkitSpeechRecognition;
const currentDims=()=>visibleDims();
function pendingDim(){let ds=currentDims();return ds.find(d=>d.value==null)||ds[0]||null}

function voicePause(){voiceRunning=false;voiceConfirming=false;voiceGen++;voiceListening=false;clearTimeout(voiceTimer);clearTimeout(bufferTimer);buffer='';try{microphone?.abort()}catch(_){}try{speechSynthesis?.cancel()}catch(_){}voiceSpeaking=false;paintVoice()}
function voiceHello(){let hour=new Date().getHours();return (hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite')+(S.meta.profissional?', '+S.meta.profissional.trim().split(/\s+/)[0]:'')+'. Vamos começar a medição.'}
function askDim(){let d=chosenDim();if(!voiceRunning||!d){voicePause();return}voiceConfirming=false;voiceSay('Cota '+d.id+'. '+d.label+'. Diga a medida.',()=>listenRecognition())}
function startVoice(){if(voiceRunning){voicePause();return}if(!chosenDim()){notify('Não há cotas para medir nesta vista.');return}if(!window.isSecureContext||!VoiceSupport){voiceError=!window.isSecureContext?'Microfone exige HTTPS.':'Reconhecimento indisponível neste navegador.';notify(voiceError);paintVoice();return}voiceRunning=true;voiceConfirming=false;voiceDraft=null;restartCount=0;paintVoice();if(firstGreeting){firstGreeting=false;voiceSay(voiceHello(),$('#handsfree').checked?askDim:listenRecognition)}else if($('#handsfree').checked)askDim();else listenRecognition()}

function received(raw){let p=interpret(raw);$('#vheard').textContent='Reconhecido: '+raw;if(p.command==='stop'){voicePause();notify('Medição encerrada.');return}if(p.command==='select'){if(currentDims().some(d=>d.id===p.cota))voiceTarget=p.cota;paintVoice();return}if(p.command==='skip'){let q=nextDim(voiceTarget);voiceTarget=q?.id||null;voiceDraft=null;voiceConfirming=false;paintVoice();if(voiceRunning)askDim();return}if(p.command==='repeat'){if(voiceDraft?.ok){voiceSay(num(voiceDraft.cm*10)+' milímetros. Confirma?',()=>listenRecognition())}else if(voiceRunning)askDim();return}if(p.command==='confirm'){confirmVoice();return}if(p.command==='reject'){voiceDraft=null;voiceConfirming=false;paintVoice();if(voiceRunning)voiceSay('Medida descartada. Repita a medida.',listenRecognition);return}if(voiceConfirming){$('#vheard').textContent='Aguardando sim ou não para confirmar a medida.';if(voiceRunning)voiceTimer=setTimeout(listenRecognition,600);return}if(p.cota){if(currentDims().some(d=>d.id===p.cota))voiceTarget=p.cota;else{notify('Essa cota não está nesta vista.');return}}voiceDraft=p;paintVoice();if(p.ok){let value=Math.round(p.cm*10*10)/10;$('#vheard').textContent='Reconhecido: '+num(value)+' mm'+(p.assumed?' · confirme unidade':'');voiceConfirming=true;if(voiceRunning){if($('#handsfree').checked)voiceSay('Cota '+voiceTarget+'. '+num(value)+' milímetros. Confirma?',listenRecognition);else{voiceRunning=false;voiceListening=false;voiceSay(num(value)+' milímetros. Confirma?',()=>paintVoice())}}}else{notify(p.error);if(voiceRunning)voiceSay('Não entendi a medida. Repita, por favor.',listenRecognition)}}
function confirmVoice(){if(!voiceDraft?.ok)return;let d=chosenDim();if(!d)return;commit();d.value=mm(voiceDraft.cm*10);let was=d.id;voiceDraft=null;voiceConfirming=false;voiceTarget=nextDim(was)?.id||null;changed();render();$('#vheard').textContent='Cota '+was+' registrada: '+num(d.value)+' mm';if(voiceRunning){if(nextDim(was))voiceSay('Confirmado.',askDim);else{voicePause();voiceSay('Medições desta vista concluídas.')}}}
function manualVoice(){let str=$('#voice-manual').value.trim();if(!str)return;$('#voice-manual').value='';received(str)}
