QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);

		var modPoly = rawPoly.mod(rsPoly);

		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function measuredWallChain(room){

 if(!walls.length||source.length<walls.length)return null;

function voiceNormalize(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ').replace(/\b(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\b/g,v=>({um:'1',uma:'1',dois:'2',duas:'2',tres:'3',quatro:'4',cinco:'5',seis:'6',sete:'7',oito:'8',nove:'9',dez:'10'}[v]))}
function allNamedRooms(){return roomSequence(true).map(r=>({id:r.id,name:S.roomNames?.[r.id]||r.ambiente||'Ambiente'}))}
function properRoomName(value){const a=String(value||'Ambiente').trim().replace(/\s+/g,' ');return a?a.charAt(0).toLocaleUpperCase('pt-BR')+a.slice(1):'Ambiente'}
function uniqueRoomLabel(wish,id){
 const wanted=properRoomName(wish);
 const taken=new Set(allNamedRooms().filter(x=>x.id!==id).map(x=>voiceNormalize(x.name)));
 if(!taken.has(voiceNormalize(wanted)))return wanted;
 const base=wanted.replace(/\s+\d+$/,'').trim()||'Ambiente';let idx=1;
 while(taken.has(voiceNormalize(base+' '+idx)))idx++;

}
function renameRoomUnique(id,wish){
 let name,base=properRoomName(wish);
 const existing=allNamedRooms().find(r=>r.id!==id&&voiceNormalize(r.name)===voiceNormalize(base));
 if(existing&&!/\s+\d+$/.test(base)&&!allNamedRooms().some(r=>r.id!==existing.id&&voiceNormalize(r.name)===voiceNormalize(base+' 1'))){
  // Two equal names become Cozinha 1 / Cozinha 2. Internal IDs are unchanged.
  S.roomNames[existing.id]=base+' 1';
  if(existing.id===S.currentRoomId)S.meta.ambiente=base+' 1';
  else{const previous=S.savedRooms.find(r=>r.id===existing.id);if(previous)previous.ambiente=base+' 1'}
  name=uniqueRoomLabel(base+' 2',id);
 }else name=uniqueRoomLabel(base,id);
 S.roomNames[id]=name;
 if(id===S.currentRoomId)S.meta.ambiente=name;
 else {let room=S.savedRooms.find(r=>r.id===id);if(room)room.ambiente=name;}
 return name;
}
function findRoomBySpokenName(text,rooms){
 const spoken=voiceNormalize(text);const candidates=(rooms||[]).filter(r=>r?.id&&r?.name).map(r=>({r,n:voiceNormalize(r.name)}));
 let full=candidates.filter(x=>x.n&&(' '+spoken+' ').includes(' '+x.n+' '));
 if(full.length===1)return full[0].r;
 if(full.length>1){full.sort((a,b)=>b.n.length-a.n.length);if(full[0].n.length!==full[1].n.length)return full[0].r;return null;}
 // Do not guess when more than one numbered room shares the base name.
 const compact=spoken.replace(/\b(ambiente|paredes|parede|medir|medicao|medidas|levantar|levantamento|iniciar|comecar|vamos|quero|do|da|de|no|na|o|a|por|favor|para|proximo|agora)\b/g,' ').replace(/\s+/g,' ').trim();
 if(!compact)return null;
 const similar=candidates.filter(x=>x.n===compact||x.n.replace(/\s+\d+$/,'')===compact);

}
function voiceIntent(raw,rooms){

 if(has(/\b(parar|pausar|silencio|encerrar assistente|desligar microfone)\b/))action='stop';
 else if(has(/\b(varredura|pendencias|pendencia|falta medir|o que falta|conferir levantamento|verificar levantamento|revisao geral|relatorio)\b/))action='audit';
 else if(has(/\b(proxima parede|proxima cota|pular medida|pular cota)\b/))action='nextdim';
 else if(has(/\b(proxim[oa]|seguinte|outr[oa] ambiente|vamos para outr[oa]|seguir adiante)\b/))action='next';
 else if(has(/\b(interferencia|interferencias|coluna|colunas|tomadas|ponto tecnico|pontos tecnicos)\b/))action='interferences';
 else if(has(/\b(bancada|bancadas|tampo)\b/))action='benches';
 else if(has(/\b(foto|fotos|fotograf|imagem|imagens)\b/))action='photos';
 else if(has(/\b(parede|paredes|pe direito|medicao|medir|levantamento|comecar|iniciar|vamos|quero|abre|abrir|seguir|continuar)\b/) && room)action='walls';
 else if(has(/\b(iniciar|comecar|vamos|levantamento|medicao|medir)\b/) && !room && !has(/\b(bancada|interferencia|foto)\b/))action='walls';
 else if(has(/\b(parede|paredes|pe direito)\b/))action='walls';

}
function roomBenchEligible(name){return /\b(cozinha|banheiro|lavabo|area de servico|lavanderia|area gourmet|churrasqueira)\b/.test(voiceNormalize(name))}

function generalReady(room){if(!room.closed||!room.walls?.length)return false;const dims=room.dims||[],required=dims.filter(d=>d.scope==='room:'+room.id||String(d.scope||'').startsWith('photo:')||String(d.scope||'').startsWith('bench:'));return room.walls.every(w=>!!w.photo&&!!w.finished&&!w.reviewRequired&&dims.some(d=>d.owner===w.id&&d.metric==='roomLength'&&d.value>0&&!d.needsReview))&&required.length>=room.walls.length+1&&required.every(d=>d.value>0&&!d.needsReview)}

function generalSurveySection(section){closeSheet();if(section==='paredes'){currentWall=S.walls[0]?.id||null;pageTo('paredes')}else if(section==='bancadas')pageTo('bancadas');else {pageTo('inicio');document.querySelector('.wallgrid')?.scrollIntoView({behavior:'smooth',block:'center'});}}
/* Vista métrica não destrutiva da planta: coordenadas internas reais das faces,
   escala gráfica única para todos os ambientes; cotas não confirmadas são aproximações.
   O editor de criação continua usando as coordenadas originais. */
const metricPixelsPerMM=.065;
function metricPlanActive(){return S.planLocked&&generalRooms().some(r=>(r.walls||[]).some(w=>w.comprimento>0))}
function schematicWorld(room,index){const poly=room.polygonDraft?.length===room.polygon?.length?room.polygonDraft:room.polygon;const b=generalBounds(poly),pos=generalPosition(room,index),sc=generalScale(room.id);return poly.map(p=>({x:(p.x-b.minX)*sc+pos.x,y:(p.y-b.minY)*sc+pos.y}));}
function metricLayout(){
 const rooms=generalRooms(),original=rooms.map((r,i)=>schematicWorld(r,i));
 let calibration=null;for(let k=0;k<rooms.length&&!calibration;k++){
  const r=rooms[k],a=original[k];for(const w of r.walls||[]){const x=a[w.i],y=a[(w.i+1)%a.length],len=x&&y?d2(x,y):0;if(len>0&&w.comprimento>0){calibration=w.comprimento/len;break;}}
 }

  const src=r.polygonDraft?.length===r.polygon?.length?r.polygonDraft:r.polygon;

 });

 // Move whole rooms ONLY: never adjust their confirmed dimensions.

  let matches=[];for(let i=0;i<j;i++){
   const a=results[i],b=results[j];if(!a.sketch?.length||!b.sketch?.length)continue;
   for(let m=0;m<a.sketch.length;m++)for(let n=0;n<b.sketch.length;n++){
    const dist=d2(a.sketch[m],b.sketch[n]);if(dist<13){const p=a.pts[m],q=b.pts[n];if(p&&q)matches.push({distance:dist,dx:a.offset.x+p.x-q.x,dy:a.offset.y+p.y-q.y});}

  const closed=confirmed&&!room.openPath&&!unresolved;
  const pts=closed?vertices:world;

  for(let k=0;k<(room.walls||[]).length;k++){const w=room.walls[k],a=world[k],b=world[k+1];if(!a||!b)continue;const m=mul(add(a,b),.5),v=sub(b,a),len=Math.hypot(v.x,v.y)||1,sg=polygonArea(vertices)>=0?1:-1,at={x:m.x-sg*v.y/len*24*unit,y:m.y+sg*v.x/len*24*unit};marks+=`<g data-g-room="${room.id}" data-g-wall="${w.id}"><circle cx="${at.x}" cy="${at.y}" r="${15*unit}" fill="white" stroke="#ab9c8d" stroke-width="${1.5*unit}"/><text x="${at.x}" y="${at.y+4*unit}" fill="#5a5149" font-size="${12*unit}" font-weight="bold" text-anchor="middle" pointer-events="none">${esc(w.letra)}</text></g>`;}

function generalSvg(){

 const rooms=generalRooms(),view=generalView,stage=$('#general-stage'),screenW=Math.max(stage?.clientWidth||Math.min(window.innerWidth-30,990),250),defs=`<defs><pattern id="general-grid" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#cfc7bd"/></pattern></defs>`;

  if(selected||S.planLocked)(r.walls||[]).forEach(w=>{const a=r.polygon[w.i],z=r.polygon[(w.i+1)%r.polygon.length];if(!a||!z)return;const m=mul(add(a,z),.5),v=sub(z,a),len=Math.hypot(v.x,v.y)||1,inward={x:-orientation*v.y/len,y:orientation*v.x/len},at=add(m,mul(inward,27*unit));parts+=`<g data-g-wall="${w.id}" data-g-room="${r.id}" data-g-edge="${w.i}" style="cursor:pointer"><circle cx="${at.x}" cy="${at.y}" r="${15*unit}" fill="white" stroke="${w.finished?'#298059':'#938c85'}" stroke-width="${1.6*unit}"/><text x="${at.x}" y="${at.y+4.5*unit}" text-anchor="middle" font-size="${12*unit}" font-weight="bold" pointer-events="none" fill="#534b43">${esc(w.letra)}</text></g>`});

// Resolução determinística de sobreposição: não esconde cotas. A mesma rotina
// serve à bancada, fotografias e PDF (reutilizam benchSVG / wallSVG).
function layoutCotas(entries,W,H,reserved=[]){
 let taken=[...reserved],placed=[];
 for(let {d,p} of entries){if(!p)continue;let base={...p},dx=base.x2-base.x1,dy=base.y2-base.y1,l=Math.hypot(dx,dy)||1;
  let outward={x:-dy/l,y:dx/l};let mid={x:(base.x1+base.x2)/2,y:(base.y1+base.y2)/2};
  let text=d.value==null?String(d.id):num(d.value),tw=Math.max(20,text.length*7.7+10),th=17;
  // Tenta primeiro a localização normal, depois diferentes níveis/posições.
  let offsets=base.inside?[0,7,-7,13,-13,20,-20]:[0,16,28,42,60,-16,-28,-42,-60,78,-78];
  let shiftAlong=[0,-.20,.20,-.35,.35];let choice=null;
  for(let off of offsets){for(let k of shiftAlong){
   let cx=mid.x+outward.x*off+dx*k,cy=mid.y+outward.y*off+dy*k;
   let box={x:cx-tw/2,y:cy-th/2,w:tw,h:th};
   let near=taken.some(r=>box.x<r.x+r.w+4&&box.x+box.w+4>r.x&&box.y<r.y+r.h+4&&box.y+box.h+4>r.y);
   if(cx-tw/2<7||cx+tw/2>W-7||cy-th/2<8||cy+th/2>H-7||near)continue;
   choice={off,k,cx,cy,box};break;
  }if(choice)break}
  if(!choice){
   // Busca bidimensional real: jamais ocupar uma faixa já reservada só
   // porque as posições lineares preferidas foram esgotadas.
   let options=[];
   for(let cy=16;cy<H-10;cy+=19)for(let cx=tw/2+9;cx<W-tw/2-9;cx+=Math.max(22,tw/2)){
    let box={x:cx-tw/2,y:cy-th/2,w:tw,h:th};
    let blocked=taken.some(r=>box.x<r.x+r.w+4&&box.x+box.w+4>r.x&&box.y<r.y+r.h+4&&box.y+box.h+4>r.y);
    if(!blocked)options.push({cx,cy,box,dist:Math.hypot(cx-mid.x,cy-mid.y)});
   }
   options.sort((a,b)=>a.dist-b.dist);
   if(options.length)choice={off:0,k:0,...options[0]};
   else { // Nunca apagar cotas: último recurso sinaliza necessidade de ampliar.
    let cx=Math.min(W-tw/2-5,Math.max(tw/2+5,mid.x)),cy=Math.min(H-th/2-5,Math.max(th/2+5,mid.y));
    choice={off:0,k:0,cx,cy,box:{x:cx-tw/2,y:cy-th/2,w:tw,h:th}};
   }
  }
  taken.push(choice.box);
  if(!base.inside&&Math.abs(choice.off)>1){
   base.x1+=outward.x*choice.off;base.y1+=outward.y*choice.off;
   base.x2+=outward.x*choice.off;base.y2+=outward.y*choice.off;
  }
  base.labelAt={x:choice.cx,y:choice.cy};placed.push({d,p:base});
 }return placed;
}

   if(int!=null&&fraction!=null){let words=spokenDecimal[2].split(/\s+/),leadZero=words[0]==='zero'?1:0;

}

 if(!assistVoiceActive||!assistConn?.open||document.hidden||assistSpeaking)return;
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){assistStatusText='Seu navegador não oferece reconhecimento de voz. Use Enviar comando ou digite a medida.';renderAssist();return}
 try{
  if(assistRec){try{assistRec.abort()}catch(_){}assistRec=null}
  let r=new Recognition(),heard=false;r._cancelled=false;assistRec=r;r.lang='pt-BR';r.interimResults=false;r.continuous=false;r.maxAlternatives=3;
  r.onresult=e=>{heard=true;assistListenFailures=0;assistantReceiveText(e.results[0][0].transcript)};
  r.onerror=e=>{if(!assistVoiceActive||['aborted','no-speech'].includes(e.error))return;assistStatusText='Microfone: '+e.error;renderAssist();if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))assistVoiceActive=false};
  r.onend=()=>{if(assistRec===r)assistRec=null;if(!heard&&!r._cancelled&&!assistSpeaking&&assistVoiceActive&&assistAuthorized){if(++assistListenFailures<=6)setTimeout(()=>{if(assistVoiceActive&&!assistRec)assistantVoiceListen()},500+assistListenFailures*170);else{assistVoiceActive=false;assistStatusText='A escuta foi interrompida pelo navegador. Toque em Ativar assistente para retomar.';renderAssist()}}};
  r.start();assistStatusText='🎙 Escutando comandos e medidas…';renderAssist();
 }catch(e){assistStatusText='Não foi possível ativar o microfone: '+e.message;renderAssist()}
}
function assistantReceiveText(text){
 if(!text?.trim())return;
 const p=interpret(text);
 if(assistWaitConfirm){
  if(p.command==='confirm')assistantConfirmDim();
  else if(p.command==='reject'){assistDraft=null;assistWaitConfirm=false;renderAssist();assistantRespond('Certo. Repita a medida.');}
  else assistantRespond('Preciso confirmar o valor antes de continuar. Diga sim ou corrigir.');return;
 }
 if(assistFlow.opposite){
  const o=assistFlow.opposite,v=voiceNormalize(text);
  if(/^(igual|sim|e a mesma|a mesma|mesma|mesmo|identica|isso|e igual|pode copiar)/.test(v)){assistFlow.opposite=null;assistantQueueExactValue(o.target,o.value);return}
  if(/^(diferente|nao|outra|nao e igual)/.test(v)){assistFlow.skippedOpposites||=[];assistFlow.skippedOpposites.push(o.target);assistFlow.opposite=null;assistantAskTask();return}
  assistantRespond('A parede '+o.targetLetter+' é igual à '+o.sourceLetter+' ou diferente?');return;
 }
 if(assistantProcessCommand(text))return;
 if(assistFlow.mode==='choice'){assistantRespond('Pode dizer próximo ambiente, interferências, bancada ou fotografias.');return}
 if(assistFlow.mode==='commands'){assistantRespond('Diga, por exemplo, medir a cozinha 1 ou quais pendências faltam.');return}
 if(p.command==='skip'){assistantNextTask();return}
 if(p.command==='stop'){assistVoiceActive=false;assistFlow.mode='commands';renderAssist();return}
 if(p.ok){
  if(!assistSelected){assistantRespond('Não há uma cota selecionada. Escolha o ambiente e a atividade.');return}
  assistDraft={value:mm(p.cm*10),id:assistSelected};assistWaitConfirm=true;renderAssist();assistantRespond(num(assistDraft.value)+' milímetros. Está correto?');
 }else assistantRespond(p.error||'Não entendi a medida. Repita com a unidade.');
}
function assistantConfirmDim(){
 if(!assistDraft||!assistAuthorized||!assistConn?.open){assistStatusText='Aguardando conexão com tablet.';renderAssist();return}
 const item={type:'measure',id:connectToken(),roomId:assistRoomId,dimId:assistDraft.id,value:assistDraft.value};
 assistQueue.push(item);try{sessionStorage.setItem('cotalab-assist-queue',JSON.stringify(assistQueue))}catch(_){};
 assistFlow.waitingAck=true;assistConn.send(item);assistDraft=null;assistWaitConfirm=false;
 assistStatusText='Medida enviada. Aguardando confirmação do tablet.';renderAssist();
}
function assistantSendPending(){if(!assistConn?.open)return;for(const item of assistQueue)try{assistConn.send(item)}catch(_){};if(assistPhotoPending&&!assistPhotoTransfer)assistantSendPhoto(assistPhotoPending)}
async function assistantLoadPhoto(file){if(!file||!file.type.startsWith('image/'))return;if(assistPhotoPending){assistStatusText='Já existe uma fotografia aguardando o tablet. Reenvie-a primeiro para evitar perder a imagem.';renderAssist();return}if(!assistAuthorized||!assistConn?.open){assistStatusText='Conecte ao tablet antes de fotografar.';renderAssist();return}
 try{let bitmap=await createImageBitmap(file),c=document.createElement('canvas'),W=Math.min(4608,bitmap.width),H=Math.round(W*bitmap.height/bitmap.width);c.width=W;c.height=H;c.getContext('2d').drawImage(bitmap,0,0,W,H);bitmap.close?.();const data=c.toDataURL('image/jpeg',.94),wallId=(assistTarget==='bench'?assistBench:assistWall)||assistState?.currentWall;if(!wallId)throw Error('Escolha uma parede ou bancada.');assistPhotoPending={id:connectToken(),wallId,data};try{await openDB();await dbPutConfirmed('assist_pending_photo',data);sessionStorage.setItem('cotalab-assist-photo',JSON.stringify({id:assistPhotoPending.id,wallId}))}catch(err){assistStatusText='Atenção: o celular não conseguiu guardar a foto para recuperação após fechar a aba. Mantenha esta tela aberta.';}assistStatusText='Foto preparada. Enviando ao tablet…';renderAssist();await assistantSendPhoto(assistPhotoPending)}catch(e){assistStatusText='Falha ao preparar foto: '+e.message;renderAssist()}}
async function assistantSendPhoto(p){if(!p||assistPhotoTransfer||!assistAuthorized||!assistConn?.open)return;assistPhotoTransfer=true;
 try{const SIZE=12000,parts=Math.ceil(p.data.length/SIZE);assistConn.send({type:'photo-meta',id:p.id,wallId:p.wallId,parts,length:p.data.length});for(let i=0;i<parts;i++){
  if(!assistConn.open)throw Error('Conexão caiu.');while(assistConn.dataChannel?.bufferedAmount>350000){await new Promise(r=>setTimeout(r,30));if(!assistConn.open)throw Error('Conexão caiu.')}
  assistConn.send({type:'photo-part',id:p.id,index:i,data:p.data.slice(i*SIZE,(i+1)*SIZE)});if(i%20===0){assistStatusText='Enviando foto '+Math.round(i*100/parts)+'%';renderAssist();await new Promise(r=>setTimeout(r,5))}
 }assistStatusText='Foto enviada. Aguardando o tablet confirmar o salvamento.';renderAssist();}
 catch(e){assistStatusText='Envio interrompido. A foto ficará disponível nesta tela para reenviar ao reconectar. '+e.message;renderAssist()}
 finally{assistPhotoTransfer=false}
}
async function assistantStart(){if(!assistMode)return;
 assistShow();try{assistQueue=JSON.parse(sessionStorage.getItem('cotalab-assist-queue')||'[]')||[]}catch(_){assistQueue=[]}
 try{let pending=JSON.parse(sessionStorage.getItem('cotalab-assist-photo')||'null');if(pending){await openDB();let data=await dbGet('assist_pending_photo');if(data)assistPhotoPending={...pending,data}}}catch(_){}
 assistantConnect().catch(e=>{assistStatusText='Falha ao conectar: '+e.message;renderAssist()});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!assistConn?.open)assistantConnect().catch(()=>{})});
}
async function assistantConnect(){
 if(!assistMode||(assistConn?.open&&assistAuthorized))return;
 const hostId=assistQuery.get('assist'),token=assistQuery.get('pin');if(!hostId?.startsWith('cl-')||!token||token.length!==32){assistStatusText='QR Code inválido. Leia novamente no tablet.';renderAssist();return}
 await loadPeerJS();if(assistPeer&&!assistPeer.destroyed){try{assistPeer.destroy()}catch(_){}}assistPeer=new window.Peer(undefined,{debug:0});
 assistPeer.on('open',()=>{assistConn=assistPeer.connect(hostId,{reliable:true});assistConn.on('open',()=>{assistAuthorized=false;assistStatusText='Verificando acesso ao levantamento…';assistConn.send({type:'hello',token});renderAssist()});assistConn.on('data',m=>{
  if(m.type==='authenticated'){assistAuthorized=true;assistStatusText='Conectado ao tablet. Recebendo planta geral…';assistConn.send({type:'snapshot-request'});assistantSendPending();renderAssist()}
  else if(m.type==='snapshot'){assistState=m;for(const room of assistRooms(m))for(const el of [...(room.walls||[]),...(room.benches||[])]){let stamp=el.photoUpdatedAt||0;if(assistPhotoRevisions[el.id]!==undefined&&assistPhotoRevisions[el.id]!==stamp){delete assistPhotoViews[el.id];assistPhotoRequested[el.id]=0;}assistPhotoRevisions[el.id]=stamp;}const r=assistRooms(m);if(!r.some(x=>x.id===assistRoomId))assistRoomId=r.find(x=>x.id===m.activeRoomId)?.id||r[0]?.id||null;const currentRoom=assistCurrentRoom(m);if(!currentRoom?.walls?.some(w=>w.id===assistWall))assistWall=currentRoom?.walls?.[0]?.id||null;let current=assistTargetTasks(m).find(d=>d.id===assistSelected);if(!current)assistSelected=assistTargetTasks(m).find(d=>d.value==null)?.id||assistTargetTasks(m)[0]?.id||null;renderAssist();if(assistTarget==='wall'&&assistWall&&currentRoom?.walls?.some(w=>w.id===assistWall&&w.photo)&&!assistPhotoViews[assistWall])assistRequestPhoto(assistWall)}
  else if(m.type==='photo-view-meta'){if(m.parts>0&&m.parts<3000&&m.length<7000000)assistPhotoChunks[m.id]={wallId:m.wallId,length:m.length,parts:new Array(m.parts),left:m.parts};}
  else if(m.type==='photo-view-part'){const transfer=assistPhotoChunks[m.id];if(transfer&&Number.isInteger(m.index)&&m.index>=0&&m.index<transfer.parts.length&&typeof m.data==='string'){if(!transfer.parts[m.index]){transfer.parts[m.index]=m.data;transfer.left--}if(transfer.left===0){const data=transfer.parts.join('');if(data.length===transfer.length&&data.startsWith('data:image/jpeg;base64,'))assistPhotoViews[transfer.wallId]=data;delete assistPhotoChunks[m.id];renderAssist()}}}
  else if(m.type==='photo-view-empty'||m.type==='photo-view-error'){assistPhotoRequested[m.wallId]=0;assistStatusText=m.type==='photo-view-empty'?'Fotografia não encontrada no tablet.':m.error||'Erro ao receber foto.';renderAssist()}
  else if(m.type==='ack'||m.type==='reject'){assistQueue=assistQueue.filter(t=>t.id!==m.id);try{sessionStorage.setItem('cotalab-assist-queue',JSON.stringify(assistQueue))}catch(_){};if(assistPhotoPending?.id===m.id&&m.type==='ack'){assistPhotoPending=null;try{sessionStorage.removeItem('cotalab-assist-photo')}catch(_){};try{if(database)database.transaction('fotos','readwrite').objectStore('fotos').delete('assist_pending_photo')}catch(_){}}
   assistStatusText=m.type==='ack'?'✓ Recebido e salvo no tablet.':'⚠ '+(m.error||'Não foi possível salvar. Confira no tablet.');renderAssist();if(assistFlow.waitingAck){if(m.type==='ack')assistantOnMeasureAck(true);else assistantOnMeasureAck(false)}else if(m.type==='ack'&&assistVoiceActive&&assistFlow.mode==='measure'){setTimeout(assistantAdvancePhase,500)}}
 });assistConn.on('close',()=>{assistAuthorized=false;assistStatusText='Conexão perdida. Tentando retornar automaticamente…';renderAssist();scheduleAssistantReconnect()});assistConn.on('error',()=>{scheduleAssistantReconnect()})});
 assistPeer.on('error',err=>{assistStatusText='Conexão: '+(err?.message||err);renderAssist();scheduleAssistantReconnect()});
}
function scheduleAssistantReconnect(){clearTimeout(assistReconnectTimer);assistReconnectTimer=setTimeout(()=>{if(assistMode&&!assistConn?.open)assistantConnect().catch(()=>scheduleAssistantReconnect())},4200)}
function assistAction(a){
 if(['photo-zoomout','photo-zoomin','photo-zoomfit'].includes(a)){assistPhotoZoom=a==='photo-zoomfit'?1:Math.max(1,Math.min(4,assistPhotoZoom*(a==='photo-zoomin'?1.4:1/1.4)));renderAssist();return}
 if(a==='refresh'){if(assistConn?.open){assistStatusText='Solicitando planta completa atualizada…';assistConn.send({type:'snapshot-request'})}else assistStatusText='Sem conexão. Reconecte ao tablet.';renderAssist();return}if(a==='reload-photo'){if(assistWall){delete assistPhotoViews[assistWall];assistPhotoRequested[assistWall]=0;assistRequestPhoto(assistWall);renderAssist()}return}if(a==='retry-photo'){if(assistPhotoPending)assistantSendPhoto(assistPhotoPending);return}
 if(a==='assistant-toggle'||a==='voice'){
 assistVoiceActive=!assistVoiceActive;if(!assistVoiceActive){try{assistRec?.abort()}catch(_){};try{speechSynthesis.cancel()}catch(_){}assistStatusText='Assistente pausado.'}
 else {assistListenFailures=0;if(assistFlow.mode==='measure')assistantAskTask();else assistantRespond('Assistente ativado. Pode falar naturalmente: vamos medir a cozinha, ou quais pendências faltam?')}
 renderAssist();return}
 if(a==='command'){const el=document.getElementById('assist-command');if(el){const v=el.value.trim();if(v){el.value='';assistantReceiveText(v)}}return}
 if(a==='audit'){assistantRunAudit(false);return}
 if(a==='audit-close'){assistAuditOpen=false;renderAssist();return}

 if(a==='next'){assistantNextTask();return}
 if(a==='parse'){const el=document.getElementById('assist-manual');if(el){const v=el.value.trim();if(v){el.value='';assistantReceiveText(v)}}return}
 if(a==='yes'){assistantConfirmDim();return}
 if(a==='no'){assistDraft=null;assistWaitConfirm=false;renderAssist();if(assistVoiceActive)assistantAskTask();return}
}

// Modo auxiliar: câmera e medidas, sem acesso ao desenho ou às interferências.
if(assistMode){
 document.addEventListener('click',e=>{const root=assistRoot();if(!root?.contains(e.target))return;let t=e.target.closest('[data-assist-review-room],[data-assist-wall],[data-assist-bench],[data-assist-room],[data-assist-target],[data-assist-tab],[data-assist-action],[data-act]');if(!t)return;if(t.dataset.assistReviewRoom){assistPickRoom(t.dataset.assistReviewRoom);assistAuditOpen=false;renderAssist();return}if(t.dataset.assistWall){if(t.dataset.assistRoom&&assistRoomId!==t.dataset.assistRoom)assistPickRoom(t.dataset.assistRoom);assistTarget='wall';assistWall=t.dataset.assistWall;assistSelected=null;assistDraft=null;assistTab='fotos';renderAssist();assistRequestPhoto(assistWall);return}if(t.dataset.assistBench){if(t.dataset.assistRoom&&assistRoomId!==t.dataset.assistRoom)assistPickRoom(t.dataset.assistRoom);assistTarget='bench';assistBench=t.dataset.assistBench;assistSelected=null;assistDraft=null;assistTab='cotas';renderAssist();return}if(t.dataset.assistTarget==='room'){assistTarget='room';assistSelected=null;assistTab='cotas';renderAssist();return}if(t.dataset.assistRoom){assistPickRoom(t.dataset.assistRoom);return}if(t.dataset.assistTab){assistTab=t.dataset.assistTab;renderAssist();return}if(t.dataset.assistAction){assistAction(t.dataset.assistAction);return}if(t.dataset.act)act(t.dataset.act,t)});
 document.addEventListener('change',e=>{let t=e.target;if(!assistRoot()?.contains(t))return;if(t.id==='assist-wall'){assistWall=t.value;renderAssist()}else if(t.id==='assist-dim'){assistSelected=Number(t.value);assistDraft=null;assistWaitConfirm=false;renderAssist()}else if(t.id==='assist-camera'){assistantLoadPhoto(t.files?.[0])}});
 document.addEventListener('keydown',e=>{if(['assist-manual','assist-command'].includes(e.target.id)&&e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();e.target.value='';if(v)assistantReceiveText(v)}});
 assistantStart();
}else{
 try{let prev=JSON.parse(sessionStorage.getItem('cotalab-connect-host')||'null');if(prev?.id&&prev?.token&&Date.now()-(prev.createdAt||Date.now())<43200000){hostSession=prev;startHostPeer().catch(e=>notify('Reconexão automática: '+e.message))}}catch(_){}
}
(async()=>{const generation=resetToken;await openDB();for(let w of [...S.walls,...S.savedRooms.flatMap(r=>r.walls),...S.benches,...S.savedRooms.flatMap(r=>r.benches||[])]){let img=await dbGet(w.id);if(generation===resetToken&&img)photoCache[w.id]=img;for(let extra of w.extraPhotos||[]){let x=await dbGet(extra.key);if(generation===resetToken&&x)photoCache[extra.key]=x}}if(generation===resetToken)render()})();
